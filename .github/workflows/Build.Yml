name: Galaxy Booster APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Projeyi olustur
        run: |
          set -e
          P=GalaxyBooster
          K=$P/app/src/main/java/com/galaxy/booster
          R=$P/app/src/main/res
          mkdir -p $K $R/mipmap-xxxhdpi $R/drawable-nodpi $R/values

          cat > $P/settings.gradle.kts <<'EOF'
          pluginManagement{repositories{google();mavenCentral();gradlePluginPortal()}}
          dependencyResolutionManagement{repositories{google();mavenCentral()}}
          rootProject.name="GalaxyBooster"
          include(":app")
          EOF
          cat > $P/build.gradle.kts <<'EOF'
          plugins{
           id("com.android.application") version "8.5.2" apply false
           id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          printf 'org.gradle.jvmargs=-Xmx2g\nandroid.nonTransitiveRClass=true\n' > $P/gradle.properties
          cat > $P/app/build.gradle.kts <<'EOF'
          plugins{id("com.android.application");id("org.jetbrains.kotlin.android")}
          android{
           namespace="com.galaxy.booster";compileSdk=34
           defaultConfig{applicationId="com.galaxy.booster";minSdk=26;targetSdk=34;versionCode=2;versionName="2.0"}
           compileOptions{sourceCompatibility=JavaVersion.VERSION_17;targetCompatibility=JavaVersion.VERSION_17}
           kotlinOptions{jvmTarget="17"}
          }
          EOF
          cat > $R/values/styles.xml <<'EOF'
          <resources><string name="app_name">Galaxy Booster</string>
          <style name="T" parent="android:Theme.Material.NoActionBar"/></resources>
          EOF

          cat > $P/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
           <uses-permission android:name="android.permission.READ_PHONE_STATE"/>
           <uses-permission android:name="android.permission.ANSWER_PHONE_CALLS"/>
           <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
           <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>
           <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>
           <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
           <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/>
           <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>
           <uses-permission android:name="android.permission.WAKE_LOCK"/>
           <application android:label="@string/app_name" android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher" android:theme="@style/T">
            <activity android:name=".MainActivity" android:exported="true" android:launchMode="singleTask">
             <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
            </activity>
            <service android:name=".KeepService" android:exported="false" android:foregroundServiceType="mediaPlayback"/>
            <receiver android:name=".SessRx" android:exported="true">
             <intent-filter>
              <action android:name="android.media.action.OPEN_AUDIO_EFFECT_CONTROL_SESSION"/>
              <action android:name="android.media.action.CLOSE_AUDIO_EFFECT_CONTROL_SESSION"/>
             </intent-filter>
            </receiver>
           </application>
          </manifest>
          EOF

          cat > $K/Fx.kt <<'EOF'
          package com.galaxy.booster
          import android.content.*
          import android.media.audiofx.AudioEffect
          import android.media.audiofx.LoudnessEnhancer
          import kotlin.math.*

          object Fx {
              var gain = 100
              var ready = false
              val sess = HashMap<Int, LoudnessEnhancer>()
              val pkgs = HashMap<Int, String>()
              var g0: LoudnessEnhancer? = null
              fun init(c: Context) { if (!ready) { ready = true; gain = c.getSharedPreferences("gb", 0).getInt("gain", 100) } }
              fun save(c: Context) { c.getSharedPreferences("gb", 0).edit().putInt("gain", gain).apply() }
              fun mB(): Int = max(0, (2000 * log10(max(gain, 1) / 100.0)).toInt())
              fun add(id: Int, pkg: String?) {
                  if (id <= 0) return
                  try { sess.remove(id)?.release(); sess[id] = LoudnessEnhancer(id).also { it.setTargetGain(mB()); it.enabled = true }; pkgs[id] = pkg ?: "?" } catch (e: Exception) {}
              }
              fun remove(id: Int) { try { sess.remove(id)?.release() } catch (e: Exception) {}; pkgs.remove(id) }
              fun setGlobal(on: Boolean): Boolean {
                  try { g0?.release(); g0 = null; if (on) g0 = LoudnessEnhancer(0).also { it.setTargetGain(mB()); it.enabled = true } } catch (e: Exception) { g0 = null; return false }
                  return true
              }
              fun apply() {
                  sess.values.forEach { try { it.setTargetGain(mB()) } catch (e: Exception) {} }
                  try { g0?.setTargetGain(mB()) } catch (e: Exception) {}
              }
          }

          class SessRx : BroadcastReceiver() {
              override fun onReceive(c: Context, i: Intent) {
                  Fx.init(c)
                  val id = i.getIntExtra(AudioEffect.EXTRA_AUDIO_SESSION, 0)
                  if (i.action == AudioEffect.ACTION_OPEN_AUDIO_EFFECT_CONTROL_SESSION) Fx.add(id, i.getStringExtra(AudioEffect.EXTRA_PACKAGE_NAME))
                  else if (i.action == AudioEffect.ACTION_CLOSE_AUDIO_EFFECT_CONTROL_SESSION) Fx.remove(id)
              }
          }
          EOF

          cat > $K/KeepService.kt <<'EOF'
          package com.galaxy.booster
          import android.app.*
          import android.content.Intent
          import android.content.IntentFilter
          import android.content.pm.ServiceInfo
          import android.media.audiofx.AudioEffect
          import android.os.Build
          import android.os.IBinder
          class KeepService : Service() {
              val rx = SessRx()
              override fun onBind(i: Intent?): IBinder? = null
              override fun onCreate() {
                  super.onCreate()
                  val f = IntentFilter().apply { addAction(AudioEffect.ACTION_OPEN_AUDIO_EFFECT_CONTROL_SESSION); addAction(AudioEffect.ACTION_CLOSE_AUDIO_EFFECT_CONTROL_SESSION) }
                  if (Build.VERSION.SDK_INT >= 33) registerReceiver(rx, f, RECEIVER_EXPORTED) else registerReceiver(rx, f)
              }
              override fun onStartCommand(i: Intent?, fl: Int, id: Int): Int {
                  val nm = getSystemService(NOTIFICATION_SERVICE) as NotificationManager
                  nm.createNotificationChannel(NotificationChannel("gb", "Galaxy Booster", NotificationManager.IMPORTANCE_LOW))
                  val pi = PendingIntent.getActivity(this, 0, Intent(this, MainActivity::class.java), PendingIntent.FLAG_IMMUTABLE)
                  val n = Notification.Builder(this, "gb").setContentTitle("Galaxy Booster çalışıyor").setSmallIcon(android.R.drawable.ic_media_play).setContentIntent(pi).build()
                  if (Build.VERSION.SDK_INT >= 29) startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PLAYBACK) else startForeground(1, n)
                  return START_STICKY
              }
              override fun onDestroy() { try { unregisterReceiver(rx) } catch (e: Exception) {}; super.onDestroy() }
          }
          EOF

          cat > $K/MainActivity.kt <<'EOF'
          package com.galaxy.booster
          import android.Manifest
          import android.animation.*
          import android.app.Activity
          import android.content.ContentUris
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.content.res.ColorStateList
          import android.graphics.*
          import android.graphics.drawable.GradientDrawable
          import android.media.*
          import android.media.audiofx.*
          import android.media.session.MediaSession
          import android.media.session.PlaybackState
          import android.net.Uri
          import android.os.*
          import android.provider.MediaStore
          import android.telecom.TelecomManager
          import android.telephony.TelephonyManager
          import android.view.*
          import android.view.animation.LinearInterpolator
          import android.widget.*
          import kotlin.math.*

          class BgView(c: Context) : View(c) {
              private val p = Paint()
              private val ph = FloatArray(3000) { (Math.random() * 6.28).toFloat() }
              var playing = false
              var boost = 0f
              override fun onDraw(cv: Canvas) {
                  val t = SystemClock.uptimeMillis() / 1000f
                  val d = resources.displayMetrics.density
                  val s = 34 * d; val g = 4 * d
                  val cols = (width / (s + g)).toInt() + 1; val rows = (height / (s + g)).toInt() + 1
                  val pulse = if (playing) (.35f + .65f * abs(sin(t * 2.4f))) * (.3f + boost) else 0f
                  for (y in 0 until rows) for (x in 0 until cols) {
                      val v = .5f + .5f * sin(t * .8f + ph[(y * cols + x) % ph.size])
                      val w = .5f + .5f * sin(x * .35f + y * .25f - t * 4f)
                      val a = (.05f + .10f * v + pulse * .5f * w).coerceAtMost(.9f)
                      val hi = pulse * w > .3f
                      p.color = Color.argb((a * 255).toInt(), if (hi) 220 else 145, if (hi) 175 else 82, 255)
                      cv.drawRect(x * (s + g), y * (s + g), x * (s + g) + s, y * (s + g) + s, p)
                  }
                  postInvalidateOnAnimation()
              }
          }

          @Suppress("DEPRECATION")
          class MainActivity : Activity() {
              val uris = ArrayList<Uri>(); val names = ArrayList<String>()
              var idx = -1; var mp: MediaPlayer? = null
              var bb: BassBoost? = null; var vz: Virtualizer? = null
              var bass = 0; var vir = 0
              var jbl = false; var resumeFocus = false
              lateinit var ms: MediaSession; lateinit var am: AudioManager
              lateinit var tTitle: TextView; lateinit var tGain: TextView; lateinit var tInfo: TextView
              lateinit var tApps: TextView; lateinit var tCount: TextView; lateinit var lib: LinearLayout
              lateinit var sGain: SeekBar; lateinit var sPos: SeekBar; lateinit var bPlay: Button; lateinit var bg: BgView
              val h = Handler(Looper.getMainLooper())
              var pc = 0
              var pulseAnim: ObjectAnimator? = null
              val attrs: AudioAttributes = AudioAttributes.Builder().setUsage(AudioAttributes.USAGE_MEDIA).setContentType(AudioAttributes.CONTENT_TYPE_MUSIC).build()
              val acc = 0xFFB56BFF.toInt(); val orange = 0xFFFF6A00.toInt()

              fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()
              fun tv(t: String, sz: Float, c: Int = 0xFFF3E8FF.toInt()) = TextView(this).apply { text = t; textSize = sz; setTextColor(c) }
              fun btn(t: String, f: () -> Unit) = Button(this).apply {
                  text = t; setTextColor(Color.WHITE); isAllCaps = false; textSize = 14f
                  background = GradientDrawable().apply { cornerRadius = dp(12).toFloat(); setColor(0xFF7136C8.toInt()) }
                  setOnClickListener { f() }
                  layoutParams = LinearLayout.LayoutParams(0, dp(48), 1f).apply { setMargins(dp(3), dp(3), dp(3), dp(3)) }
              }
              fun row(vararg v: View) = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; v.forEach { addView(it) } }
              fun card(vararg v: View) = LinearLayout(this).apply {
                  orientation = LinearLayout.VERTICAL; setPadding(dp(14), dp(12), dp(14), dp(12))
                  background = GradientDrawable().apply { cornerRadius = dp(16).toFloat(); setColor(0xDD1B0B38.toInt()); setStroke(dp(1), 0x88B56BFF.toInt()) }
                  layoutParams = LinearLayout.LayoutParams(-1, -2).apply { setMargins(0, dp(6), 0, dp(6)) }
                  v.forEach { addView(it) }
              }
              fun sb(max: Int, p: Int, f: (Int) -> Unit) = SeekBar(this).apply {
                  this.max = max; progress = p
                  progressTintList = ColorStateList.valueOf(acc); thumbTintList = ColorStateList.valueOf(0xFFD8B4FE.toInt())
                  setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(s: SeekBar?, v: Int, u: Boolean) { if (u) f(v) }
                      override fun onStartTrackingTouch(s: SeekBar?) {}
                      override fun onStopTrackingTouch(s: SeekBar?) {}
                  })
              }
              fun sw(t: String, f: (Boolean) -> Unit) = Switch(this).apply { text = t; setTextColor(0xFFF3E8FF.toInt()); setOnCheckedChangeListener { _, c -> f(c) } }

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  Fx.init(this)
                  window.statusBarColor = 0xFF0D0618.toInt(); window.navigationBarColor = 0xFF0D0618.toInt()
                  am = getSystemService(AUDIO_SERVICE) as AudioManager
                  bg = BgView(this)
                  val gal = ImageView(this).apply { setImageResource(R.drawable.galaxy); layoutParams = LinearLayout.LayoutParams(dp(150), dp(150)).apply { gravity = Gravity.CENTER_HORIZONTAL } }
                  ObjectAnimator.ofFloat(gal, "rotation", 0f, 360f).apply { duration = 40000; repeatCount = ValueAnimator.INFINITE; interpolator = LinearInterpolator(); start() }
                  tGain = tv("${Fx.gain}%", 54f, 0xFFD8B4FE.toInt()).apply { gravity = Gravity.CENTER; typeface = Typeface.DEFAULT_BOLD }
                  sGain = sb(500, Fx.gain) { setGain(it) }
                  tApps = tv("Güçlendirilen uygulama yok. Önce bunu aç, sonra müziği başlat.", 12f, 0xFFA78BCF.toInt())
                  tTitle = tv("Parça seçilmedi", 15f).apply { maxLines = 1; ellipsize = android.text.TextUtils.TruncateAt.END }
                  sPos = sb(1000, 0) { mp?.let { m -> m.seekTo(it * m.duration / 1000) } }
                  bPlay = btn("▶") { toggle() }.also { (it.layoutParams as LinearLayout.LayoutParams).weight = 1.6f; it.textSize = 22f }
                  tInfo = tv("JBL modu kapalı", 12f, 0xFFA78BCF.toInt())
                  tCount = tv("Müzikler yükleniyor", 12f, 0xFFA78BCF.toInt())
                  lib = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  val search = EditText(this).apply {
                      hint = "Şarkı ara"; setHintTextColor(0xFF8B73B3.toInt()); setTextColor(Color.WHITE); isSingleLine = true
                      addTextChangedListener(object : android.text.TextWatcher {
                          override fun afterTextChanged(s: android.text.Editable?) { renderLib(s.toString()) }
                          override fun beforeTextChanged(s: CharSequence?, a: Int, b: Int, c: Int) {}
                          override fun onTextChanged(s: CharSequence?, a: Int, b: Int, c: Int) {}
                      })
                  }
                  val box = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL; setPadding(dp(14), dp(40), dp(14), dp(30))
                      addView(tv("Galaxy Booster", 22f).apply { gravity = Gravity.CENTER; typeface = Typeface.DEFAULT_BOLD })
                      addView(gal)
                      addView(card(tGain, sGain, row(btn("100") { setGain(100) }, btn("200") { setGain(200) }, btn("300") { setGain(300) }, btn("500") { setGain(500) }),
                          sw("Tüm sistemi güçlendir (deneysel)") { if (!Fx.setGlobal(it)) toast("Bu cihaz desteklemiyor") }, tApps))
                      addView(card(tTitle, sPos, row(btn("⏮") { prev() }, bPlay, btn("⏭") { next() })))
                      addView(card(tv("Telefondaki müzikler", 13f, 0xFFA78BCF.toInt()), tCount, search, lib))
                      addView(card(tv("Efektler (bu uygulamanın çaları)", 13f, 0xFFC4A1FF.toInt()), tv("Bas", 12f), sb(1000, 0) { bass = it; applyFx() }, tv("Surround", 12f), sb(1000, 0) { vir = it; applyFx() },
                          row(btn("15 dk") { sleep(15) }, btn("30 dk") { sleep(30) }, btn("60 dk") { sleep(60) }, btn("Zamanlayıcı kapat") { sleep(0) })))
                      addView(card(tv("Kamera stüdyosu", 17f, 0xFFE9D5FF.toInt()), tv("Hareketli an yakalama ve klasik fotoğraf çekimi", 12f, 0xFFBFA6E8.toInt()),
                          row(btn("Hareketli çekim") { captureMotion() }, btn("Normal kamera") { capturePhoto() }),
                          row(btn("Kamera ayarları") { cameraSettings() }, btn("Uygulama ayarları") { appSettings() })))
                      addView(card(tv("Galaxy görünümü", 13f, 0xFFC4A1FF.toInt()), tv("Mor galaksi arka planı, parıltı animasyonu ve müzik tepkisi etkin.", 12f, 0xFFBFA6E8.toInt())))
                      addView(card(sw("JBL modu") { jbl = it; tInfo.setTextColor(if (it) orange else 0xFFA78BCF.toInt()); tInfo.text = if (it) "Açık: 1 basış durdur/devam, 2 sonraki, 3 önceki. Ses +/- güçlendirmeyi değiştirir. Aramada tek basış cevaplar, görüşmede kapatır." else "JBL modu kapalı"; toast(if (it) "JBL modu açık" else "JBL modu kapalı") }, tInfo))
                  }
                  setContentView(FrameLayout(this).apply {
                      setBackgroundColor(0xFF0D0618.toInt()); addView(bg, -1, -1)
                      addView(ScrollView(this@MainActivity).apply { addView(box) }, -1, -1)
                  })
                  for (i in 0 until box.childCount) box.getChildAt(i).apply { alpha = 0f; translationY = dp(30).toFloat(); animate().alpha(1f).translationY(0f).setStartDelay(i * 90L).setDuration(450).start() }
                  setupSession()
                  startForegroundService(Intent(this, KeepService::class.java))
                  requestPermissions(arrayOf(Manifest.permission.READ_PHONE_STATE, Manifest.permission.ANSWER_PHONE_CALLS, "android.permission.POST_NOTIFICATIONS", "android.permission.READ_MEDIA_AUDIO", "android.permission.READ_EXTERNAL_STORAGE"), 1)
                  h.post(object : Runnable { override fun run() {
                      mp?.let { if (it.isPlaying) sPos.progress = it.currentPosition * 1000 / max(1, it.duration) }
                      val a = Fx.pkgs.values.map { it.substringAfterLast('.') }.distinct()
                      if (a.isNotEmpty()) tApps.text = "Güçlendirilen: " + a.joinToString(", ")
                      h.postDelayed(this, 700)
                  } })
              }
              override fun onRequestPermissionsResult(c: Int, p: Array<out String>, r: IntArray) { loadLib() }

              fun toast(s: String) = Toast.makeText(this, s, Toast.LENGTH_SHORT).show()

              private val cameraPrefs by lazy { getSharedPreferences("galaxy_camera", MODE_PRIVATE) }
              private fun capturePhoto() {
                  try { startActivityForResult(Intent(MediaStore.ACTION_IMAGE_CAPTURE), 701) }
                  catch (e: Exception) { toast("Kamera uygulaması bulunamadı") }
              }
              private fun captureMotion() {
                  val seconds = cameraPrefs.getInt("clip_seconds", 3)
                  try {
                      val i = Intent(MediaStore.ACTION_VIDEO_CAPTURE).apply {
                          putExtra(MediaStore.EXTRA_DURATION_LIMIT, seconds)
                          putExtra(MediaStore.EXTRA_VIDEO_QUALITY, 1)
                      }
                      startActivityForResult(i, 702)
                  } catch (e: Exception) { toast("Video kamera açılamadı") }
              }
              private fun cameraSettings() {
                  val current = cameraPrefs.getInt("clip_seconds", 3)
                  val choices = arrayOf("2 saniye", "3 saniye", "5 saniye", "10 saniye", "15 saniye")
                  val values = intArrayOf(2, 3, 5, 10, 15)
                  val selected = values.indexOf(current).coerceAtLeast(0)
                  android.app.AlertDialog.Builder(this)
                      .setTitle("Hareketli çekim süresi")
                      .setSingleChoiceItems(choices, selected) { dialog, which ->
                          cameraPrefs.edit().putInt("clip_seconds", values[which]).apply()
                          toast("Çekim süresi: ${values[which]} saniye")
                          dialog.dismiss()
                      }
                      .setNegativeButton("Kapat", null)
                      .show()
              }
              private fun appSettings() {
                  val panel = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(22), dp(12), dp(22), dp(8))
                  }
                  val anim = Switch(this).apply {
                      text = "Arka plan animasyonu"
                      setTextColor(0xFFF3E8FF.toInt())
                      isChecked = cameraPrefs.getBoolean("animations", true)
                  }
                  val glow = Switch(this).apply {
                      text = "Yoğun mor parıltı"
                      setTextColor(0xFFF3E8FF.toInt())
                      isChecked = cameraPrefs.getBoolean("purple_glow", true)
                  }
                  panel.addView(anim); panel.addView(glow)
                  android.app.AlertDialog.Builder(this)
                      .setTitle("Galaxy Booster ayarları")
                      .setView(panel)
                      .setPositiveButton("Kaydet") { _, _ ->
                          cameraPrefs.edit().putBoolean("animations", anim.isChecked)
                              .putBoolean("purple_glow", glow.isChecked).apply()
                          bg.alpha = if (anim.isChecked) 1f else 0.35f
                          toast("Görünüm ayarları kaydedildi")
                      }
                      .setNegativeButton("Vazgeç", null)
                      .show()
              }

              fun setGain(v: Int) {
                  Fx.gain = v.coerceIn(0, 500); sGain.progress = Fx.gain; tGain.text = "${Fx.gain}%"; Fx.apply(); Fx.save(this); applyFx()
                  tGain.animate().scaleX(1.12f).scaleY(1.12f).setDuration(80).withEndAction { tGain.animate().scaleX(1f).scaleY(1f).setDuration(120).start() }.start()
                  bg.boost = Fx.gain / 500f
              }
              fun applyFx() {
                  val v = min(Fx.gain, 100) / 100f
                  mp?.setVolume(v, v)
                  try { bb?.setStrength(bass.toShort()) } catch (e: Exception) {}
                  try { vz?.setStrength(vir.toShort()) } catch (e: Exception) {}
              }
              fun sleep(m: Int) {
                  h.removeCallbacks(sleepR)
                  if (m > 0) { h.postDelayed(sleepR, m * 60000L); toast("$m dk sonra durdurulacak") } else toast("Zamanlayıcı kapalı")
              }
              val sleepR = Runnable { mp?.pause(); onState() }

              /* Telefondaki müzikleri tara */
              fun loadLib() {
                  uris.clear(); names.clear()
                  val base = MediaStore.Audio.Media.EXTERNAL_CONTENT_URI
                  val m = MediaStore.Audio.Media.DURATION
                  try {
                      contentResolver.query(base, arrayOf(MediaStore.Audio.Media._ID, MediaStore.Audio.Media.TITLE, MediaStore.Audio.Media.ARTIST),
                          "$m>=30000 AND ${MediaStore.Audio.Media.IS_RINGTONE}=0 AND ${MediaStore.Audio.Media.IS_NOTIFICATION}=0 AND ${MediaStore.Audio.Media.IS_ALARM}=0",
                          null, MediaStore.Audio.Media.DATE_ADDED + " DESC")?.use { c ->
                          while (c.moveToNext()) {
                              uris.add(ContentUris.withAppendedId(base, c.getLong(0)))
                              val a = c.getString(2)
                              names.add(c.getString(1) + (if (a != null && a != "<unknown>") " - " + a else ""))
                          }
                      }
                  } catch (e: Exception) { toast("Müzik izni gerekli") }
                  renderLib("")
              }
              fun renderLib(q: String) {
                  lib.removeAllViews(); var n = 0
                  for (i in names.indices) {
                      if (q.isEmpty() || names[i].contains(q, true)) {
                          lib.addView(tv(names[i], 14f).apply { maxLines = 1; ellipsize = android.text.TextUtils.TruncateAt.END; setPadding(dp(4), dp(11), dp(4), dp(11)); setOnClickListener { play(i) } })
                          if (++n >= 40) break
                      }
                  }
                  tCount.text = "${uris.size} şarkı" + if (n >= 40) " (ilk 40 gösteriliyor, aramayı kullan)" else ""
              }

              fun play(i: Int) {
                  if (i < 0 || i >= uris.size) return
                  idx = i
                  mp?.let { Fx.remove(it.audioSessionId); it.release() }; bb?.release(); vz?.release()
                  try {
                      mp = MediaPlayer().apply { setAudioAttributes(attrs); setDataSource(this@MainActivity, uris[i]); prepare(); setOnCompletionListener { next() } }
                  } catch (e: Exception) { toast("Dosya açılamadı"); return }
                  val sid = mp!!.audioSessionId
                  Fx.add(sid, "galaxy.booster")
                  try { bb = BassBoost(0, sid).also { it.enabled = true } } catch (e: Exception) {}
                  try { vz = Virtualizer(0, sid).also { it.enabled = true } } catch (e: Exception) {}
                  am.requestAudioFocus(AudioFocusRequest.Builder(AudioManager.AUDIOFOCUS_GAIN).setAudioAttributes(attrs).setOnAudioFocusChangeListener(afl).build())
                  applyFx(); mp!!.start(); tTitle.text = names[i]
                  onState()
              }
              val afl = AudioManager.OnAudioFocusChangeListener { c ->
                  when (c) {
                      AudioManager.AUDIOFOCUS_LOSS_TRANSIENT -> if (mp?.isPlaying == true) { mp?.pause(); resumeFocus = true; onState() }
                      AudioManager.AUDIOFOCUS_GAIN -> if (resumeFocus) { resumeFocus = false; mp?.start(); onState() }
                      AudioManager.AUDIOFOCUS_LOSS -> { mp?.pause(); onState() }
                  }
              }
              fun toggle() { val m = mp ?: return; if (m.isPlaying) m.pause() else m.start(); onState() }
              fun next() { if (uris.isNotEmpty()) play((idx + 1) % uris.size) }
              fun prev() { if ((mp?.currentPosition ?: 0) > 4000) mp?.seekTo(0) else if (uris.isNotEmpty()) play((idx - 1 + uris.size) % uris.size) }
              fun onState() {
                  val on = mp?.isPlaying == true
                  bPlay.text = if (on) "⏸" else "▶"; bg.playing = on
                  pulseAnim?.cancel()
                  if (on) pulseAnim = ObjectAnimator.ofPropertyValuesHolder(bPlay, PropertyValuesHolder.ofFloat("scaleX", 1f, 1.08f), PropertyValuesHolder.ofFloat("scaleY", 1f, 1.08f)).apply { duration = 600; repeatMode = ValueAnimator.REVERSE; repeatCount = ValueAnimator.INFINITE; start() }
                  else { bPlay.scaleX = 1f; bPlay.scaleY = 1f }
                  val st = if (on) PlaybackState.STATE_PLAYING else PlaybackState.STATE_PAUSED
                  ms.setPlaybackState(PlaybackState.Builder().setActions(PlaybackState.ACTION_PLAY or PlaybackState.ACTION_PAUSE or PlaybackState.ACTION_PLAY_PAUSE or PlaybackState.ACTION_SKIP_TO_NEXT or PlaybackState.ACTION_SKIP_TO_PREVIOUS)
                      .setState(st, (mp?.currentPosition ?: 0).toLong(), 1f).build())
              }

              /* JBL modu: kulaklık tuşları */
              fun setupSession() {
                  ms = MediaSession(this, "GalaxyBooster")
                  ms.setCallback(object : MediaSession.Callback() {
                      override fun onMediaButtonEvent(i: Intent): Boolean {
                          val e = i.getParcelableExtra<KeyEvent>(Intent.EXTRA_KEY_EVENT)
                          if (e != null && e.action == KeyEvent.ACTION_DOWN && e.repeatCount == 0) runOnUiThread { key(e.keyCode) }
                          return true
                      }
                  })
                  ms.isActive = true
                  onState()
              }
              fun key(k: Int) {
                  when (k) {
                      KeyEvent.KEYCODE_VOLUME_UP -> if (jbl) setGain(Fx.gain + 10)
                      KeyEvent.KEYCODE_VOLUME_DOWN -> if (jbl) setGain(Fx.gain - 10)
                      KeyEvent.KEYCODE_MEDIA_NEXT -> next()
                      KeyEvent.KEYCODE_MEDIA_PREVIOUS -> prev()
                      KeyEvent.KEYCODE_MEDIA_STOP -> { mp?.pause(); onState() }
                      KeyEvent.KEYCODE_HEADSETHOOK, KeyEvent.KEYCODE_MEDIA_PLAY_PAUSE, KeyEvent.KEYCODE_MEDIA_PLAY, KeyEvent.KEYCODE_MEDIA_PAUSE ->
                          if (!jbl) toggle() else if (!callAction()) press()
                  }
              }
              val pressR = Runnable {
                  val n = pc; pc = 0
                  when (n) { 1 -> { toggle(); tInfo.text = "1 basış: durdur/devam" }; 2 -> { next(); tInfo.text = "2 basış: sonraki" }; else -> { prev(); tInfo.text = "3 basış: önceki" } }
              }
              fun press() { pc++; h.removeCallbacks(pressR); h.postDelayed(pressR, 380) }
              fun callAction(): Boolean {
                  try {
                      if (checkSelfPermission(Manifest.permission.ANSWER_PHONE_CALLS) != PackageManager.PERMISSION_GRANTED) return false
                      val ts = getSystemService(TELEPHONY_SERVICE) as TelephonyManager
                      val tm = getSystemService(TELECOM_SERVICE) as TelecomManager
                      if (ts.callState == TelephonyManager.CALL_STATE_RINGING) { tm.acceptRingingCall(); tInfo.text = "Arama cevaplandı"; return true }
                      if (ts.callState == TelephonyManager.CALL_STATE_OFFHOOK) { tm.endCall(); tInfo.text = "Arama kapatıldı"; return true }
                  } catch (e: Exception) {}
                  return false
              }
              override fun onKeyDown(k: Int, e: KeyEvent): Boolean {
                  if (jbl && (k == KeyEvent.KEYCODE_VOLUME_UP || k == KeyEvent.KEYCODE_VOLUME_DOWN)) { key(k); return true }
                  return super.onKeyDown(k, e)
              }
              override fun onDestroy() { super.onDestroy(); ms.release(); mp?.release() }
          }
          EOF

          pip install pillow -q
          python3 - <<'PY'
          import glob
          from PIL import Image, ImageDraw
          f=[x for x in glob.glob('galaxy.*') if x.lower().endswith(('jpg','jpeg','png','webp'))]
          im=Image.open(f[0]).convert('RGB') if f else Image.new('RGB',(512,512),(88,28,180))
          def circ(s):
              r=im.resize((s,s),Image.LANCZOS).convert('RGBA')
              m=Image.new('L',(s*4,s*4),0); ImageDraw.Draw(m).ellipse((0,0,s*4-1,s*4-1),fill=255)
              r.putalpha(m.resize((s,s),Image.LANCZOS)); return r
          P='GalaxyBooster/app/src/main/res/'
          circ(192).save(P+'mipmap-xxxhdpi/ic_launcher.png')
          circ(512).save(P+'drawable-nodpi/galaxy.png')
          PY
      - name: APK derle
        working-directory: GalaxyBooster
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: GalaxyBooster-APK
          path: GalaxyBooster/app/build/outputs/apk/debug/*.apk
