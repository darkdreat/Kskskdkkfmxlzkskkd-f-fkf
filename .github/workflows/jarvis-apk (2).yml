                      when (e.action) {
                          MotionEvent.ACTION_DOWN -> {
                              sx = lp.x
                              sy = lp.y
                              tx = e.rawX
                              ty = e.rawY
                              moved = false
                          }
                          MotionEvent.ACTION_MOVE -> {
                              val dx = e.rawX - tx
                              val dy = e.rawY - ty
                              if (Math.abs(dx) > dp(6) || Math.abs(dy) > dp(6)) moved = true
                              if (moved) {
                                  lp.x = sx + dx.toInt()
                                  lp.y = sy + dy.toInt()
                                  wm.updateViewLayout(v, lp)
                              }
                          }
                          MotionEvent.ACTION_UP -> if (!moved) togglePanel()
                      }
                      true
                  }
                  wm.addView(v, lp)
                  orb = v
              }

              private fun buildPanel() {
                  val box = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(14), dp(12), dp(14), dp(12))
                      background = GradientDrawable().apply {
                          setColor(0xF2071120.toInt())
                          cornerRadius = dp(22).toFloat()
                          setStroke(dp(1), 0x6600E5FF)
                      }
                  }

                  val title = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  val name = TextView(this).apply {
                      text = "J.A.R.V.I.S"
                      setTextColor(0xFF00E5FF.toInt())
                      textSize = 15f
                      letterSpacing = 0.2f
                      setTypeface(typeface, android.graphics.Typeface.BOLD)
                  }
                  title.addView(name, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))
                  val close = TextView(this).apply {
                      text = "✕"
                      setTextColor(0xFF8CA8BD.toInt())
                      textSize = 18f
                      setPadding(dp(10), 0, 0, 0)
                      setOnClickListener { togglePanel() }
                  }
                  title.addView(close)
                  box.addView(title)

                  scroll = ScrollView(this)
                  log = TextView(this).apply {
                      text = "Merhaba! Örnek: \"Annem'e geliyorum yaz\"\n\n"
                      setTextColor(0xFFEAFBFF.toInt())
                      textSize = 14f
                      setLineSpacing(0f, 1.15f)
                  }
                  scroll.addView(log)
                  box.addView(scroll, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, dp(150)).apply {
                      topMargin = dp(8)
                      bottomMargin = dp(8)
                  })

                  val row = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  field = EditText(this).apply {
                      hint = "Jarvis'e yaz..."
                      setHintTextColor(0xFF8CA8BD.toInt())
                      setTextColor(0xFFEAFBFF.toInt())
                      textSize = 14f
                      maxLines = 3
                      inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_FLAG_CAP_SENTENCES
                      imeOptions = EditorInfo.IME_ACTION_SEND
                      background = GradientDrawable().apply {
                          setColor(0xFF0A192B.toInt())
                          cornerRadius = dp(18).toFloat()
                          setStroke(dp(1), 0x5500E5FF)
                      }
                      setPadding(dp(14), dp(8), dp(14), dp(8))
                      setOnEditorActionListener { _, id, _ ->
                          if (id == EditorInfo.IME_ACTION_SEND) {
                              submit()
                              true
                          } else false
                      }
                  }
                  row.addView(field, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))
                  val send = TextView(this).apply {
                      text = "➤"
                      setTextColor(0xFF030814.toInt())
                      textSize = 18f
                      gravity = Gravity.CENTER
                      background = GradientDrawable().apply {
                          shape = GradientDrawable.OVAL
                          setColor(0xFF00E5FF.toInt())
                      }
                      setOnClickListener { submit() }
                  }
                  row.addView(send, LinearLayout.LayoutParams(dp(44), dp(44)).apply { leftMargin = dp(8) })
                  box.addView(row)
                  panel = box
              }

              private fun togglePanel() {
                  val p = panel ?: return
                  if (panelShown) {
                      try {
                          wm.removeView(p)
                      } catch (_: Exception) {
                      }
                      panelShown = false
                  } else {
                      val lp = WindowManager.LayoutParams(
                          (resources.displayMetrics.widthPixels * 0.92f).toInt(),
                          WindowManager.LayoutParams.WRAP_CONTENT,
                          WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                          WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL,
                          PixelFormat.TRANSLUCENT
                      ).apply {
                          gravity = Gravity.TOP or Gravity.CENTER_HORIZONTAL
                          y = dp(90)
                          softInputMode = WindowManager.LayoutParams.SOFT_INPUT_ADJUST_RESIZE or
                              WindowManager.LayoutParams.SOFT_INPUT_STATE_VISIBLE
                      }
                      wm.addView(p, lp)
                      panelShown = true
                      field.requestFocus()
                  }
              }

              private fun append(s: String) {
                  log.append(s + "\n\n")
                  scroll.post { scroll.fullScroll(View.FOCUS_DOWN) }
              }

              private fun submit() {
                  val q = field.text.toString().trim()
                  if (q.isEmpty()) return
                  field.setText("")
                  append("Sen: $q")
                  scope.launch {
                      val a = Brain.respond(this@FloatingService, q)
                      Bus.state = JState.IDLE
                      append("Jarvis: $a")
                      speaker?.speak(a) { Bus.state = JState.IDLE }
                      // Mesaj gönderilirken panel WhatsApp'ın önünde kalmasın.
                      if (a.contains("gönderiyorum") || a.contains("hazırladım")) {
                          if (panelShown) togglePanel()
                      }
                  }
              }

              override fun onDestroy() {
                  scope.cancel()
                  if (this::wm.isInitialized) {
                      try {
                          orb?.let { wm.removeView(it) }
                      } catch (_: Exception) {
                      }
                      try {
                          if (panelShown) panel?.let { wm.removeView(it) }
                      } catch (_: Exception) {
                      }
                  }
                  speaker?.shutdown()
                  Flags.floating = false
                  super.onDestroy()
              }
          }
