                                                              Toast.LENGTH_SHORT
                                                          ).show()
                                                      } else if (listening) {
                                                          ears.cancel()
                                                          Bus.state = JState.IDLE
                                                      } else {
                                                          requireMic(0)
                                                      }
                                                  },
                                                  modifier = Modifier
                                                      .graphicsLayer {
                                                          scaleX = micScale
                                                          scaleY = micScale
                                                      }
                                                      .background(if (listening) GREEN.copy(alpha = 0.35f) else PANEL, CircleShape)
                                              ) { Text("🎙", fontSize = 20.sp) }

                                              Spacer(Modifier.width(5.dp))

                                              OutlinedTextField(
                                                  value = input,
                                                  onValueChange = { input = it },
                                                  modifier = Modifier.weight(1f),
                                                  placeholder = { Text("Jarvis'e yaz...", color = MUTED) },
                                                  maxLines = 3,
                                                  shape = RoundedCornerShape(18.dp),
                                                  colors = fieldColors(),
                                                  keyboardOptions = KeyboardOptions(imeAction = ImeAction.Send),
                                                  keyboardActions = KeyboardActions(onSend = { send(input) })
                                              )

                                              Spacer(Modifier.width(5.dp))

                                              Button(
                                                  enabled = !busy,
