          @Composable
          fun BackgroundFx() {
              val t = rememberInfiniteTransition(label = "bg")
              val p by t.animateFloat(
                  0f, 1f,
                  infiniteRepeatable(tween(36000, easing = LinearEasing)),
                  label = "p"
              )
              Canvas(Modifier.fillMaxSize()) {
                  val step = 52.dp.toPx()
                  var x = 0f
                  while (x < size.width) {
                      drawLine(CYAN.copy(alpha = 0.03f), Offset(x, 0f), Offset(x, size.height))
                      x += step
                  }
                  var y = p * step
                  while (y < size.height) {
                      drawLine(CYAN.copy(alpha = 0.03f), Offset(0f, y), Offset(size.width, y))
                      y += step
                  }
                  for (i in 0 until 26) {
                      val sx = ((i * 37) % 100) / 100f
                      val sy = ((i * 61) % 100) / 100f
                      val k = 1 + (i % 3)
                      val yy = (((sy - p * k) % 1f) + 1f) % 1f
                      val xx = sx + sin(p * 4f * PI.toFloat() + i) * 0.02f
                      drawCircle(
                          CYAN.copy(alpha = 0.18f),
                          radius = (1.2f + (i % 3) * 0.7f).dp.toPx(),
                          center = Offset(xx * size.width, yy * size.height)
                      )
                  }
              }
          }

          /** Ark reaktörü: 10 bobinli halka, dönen cetvel, tarama yayı ve ışıyan çekirdek. */
          @Composable
          fun Reactor(state: JState, level: Float, modifier: Modifier = Modifier) {
              val tr = rememberInfiniteTransition(label = "reactor")
              val spinSlow by tr.animateFloat(
                  0f, 360f, infiniteRepeatable(tween(46000, easing = LinearEasing)), label = "spinSlow"
              )
              val spinMid by tr.animateFloat(
                  360f, 0f, infiniteRepeatable(tween(20000, easing = LinearEasing)), label = "spinMid"
              )
              val sweep by tr.animateFloat(
                  0f, 360f, infiniteRepeatable(tween(5200, easing = LinearEasing)), label = "sweep"
              )
              val breathe by tr.animateFloat(
                  0f, 1f,
                  infiniteRepeatable(tween(2400, easing = FastOutSlowInEasing), RepeatMode.Reverse),
                  label = "breathe"
              )
              val phase by tr.animateFloat(
                  0f, (2 * PI).toFloat(), infiniteRepeatable(tween(1500, easing = LinearEasing)), label = "phase"
              )
              val color by animateColorAsState(
                  when (state) {
                      JState.THINKING -> ORANGE
                      JState.LISTENING -> GREEN
                      JState.WAKE -> PURPLE
                      else -> CYAN
                  },
                  tween(600), label = "reactorColor"
              )
              val lv by animateFloatAsState(level.coerceIn(0f, 1f), tween(120), label = "reactorLevel")
              val speaking = state == JState.LISTENING || state == JState.SPEAKING
              val thinking = state == JState.THINKING
              val energy = if (speaking) lv else 0f

              Canvas(modifier) {
                  val r = size.minDimension / 2f
                  val c = center
                  val hair = 1.dp.toPx()

                  fun arc(rad: Float, start: Float, sw: Float, col: Color, w: Float, cap: StrokeCap = StrokeCap.Butt) {
                      drawArc(
                          col, start, sw, false,
                          Offset(c.x - rad, c.y - rad), Size(rad * 2f, rad * 2f),
                          style = Stroke(w, cap = cap)
                      )
                  }

                  // Dış parıltı
                  drawCircle(
                      Brush.radialGradient(
                          listOf(color.copy(alpha = 0.10f + 0.12f * breathe + 0.22f * energy), Color.Transparent),
                          center = c, radius = r
                      ),
                      radius = r, center = c
                  )

                  // Koyu gövde ve metalik çerçeve
                  drawCircle(Color(0xFF061420), r * 0.93f, c)
                  drawCircle(
                      Brush.sweepGradient(
                          listOf(
                              color.copy(alpha = 0.95f), color.copy(alpha = 0.15f), color.copy(alpha = 0.75f),
                              color.copy(alpha = 0.15f), color.copy(alpha = 0.95f)
                          ),
                          c
                      ),
                      r * 0.965f, c, style = Stroke(3.dp.toPx())
                  )

                  // Yavaş dönen cetvel çizgileri
                  rotate(spinSlow) {
                      for (i in 0 until 90) {
                          val a = Math.toRadians(i * 4.0)
                          val major = i % 9 == 0
                          val len = if (major) 9.dp.toPx() else 4.dp.toPx()
                          val rr = r * 0.90f
                          drawLine(
                              color.copy(alpha = if (major) 0.85f else 0.28f),
                              Offset(c.x + cos(a).toFloat() * rr, c.y + sin(a).toFloat() * rr),
                              Offset(c.x + cos(a).toFloat() * (rr - len), c.y + sin(a).toFloat() * (rr - len)),
                              strokeWidth = if (major) 1.6.dp.toPx() else hair
                          )
                      }
                  }

                  // Ters yönde dönen üç ince yay
                  rotate(spinMid) {
                      for (i in 0 until 3) {
                          arc(r * 0.80f, i * 120f + 10f, 70f, color.copy(alpha = 0.8f), 2.5.dp.toPx(), StrokeCap.Round)
                      }
                  }

                  // 10 bobinli ana halka
                  arc(r * 0.60f, 0f, 360f, Color(0xFF0A2234), r * 0.25f)
                  for (i in 0 until 10) {
                      val shimmer = 0.8f + 0.2f * sin(phase + i * 0.7f)
                      val a = ((0.5f + 0.25f * breathe + 0.3f * energy) * shimmer).coerceIn(0f, 1f)
                      val st = i * 36f + 5.5f
                      arc(r * 0.60f, st, 25f, color.copy(alpha = a * 0.28f), r * 0.24f)
                      arc(r * 0.60f, st, 25f, color.copy(alpha = a), r * 0.15f)
                  }
                  drawCircle(color.copy(alpha = 0.5f), r * 0.72f, c, style = Stroke(hair))
                  drawCircle(color.copy(alpha = 0.5f), r * 0.48f, c, style = Stroke(hair))

                  // Tarama yayı
                  rotate(sweep) {
                      arc(r * 0.42f, 0f, if (thinking) 120f else 60f, color, 3.dp.toPx(), StrokeCap.Round)
                      arc(r * 0.42f, 180f, 25f, color.copy(alpha = 0.35f), 2.dp.toPx(), StrokeCap.Round)
                  }

                  // Konuşurken ses dalgası
                  if (speaking) {
                      for (i in 0 until 60) {
                          val a = Math.toRadians(i * 6.0)
                          val len = (2f + 9f * lv * (0.3f + 0.7f * abs(sin(phase + i * 0.5f)))).dp.toPx()
                          val rr = r * 0.335f
                          drawLine(
                              color.copy(alpha = 0.9f),
                              Offset(c.x + cos(a).toFloat() * rr, c.y + sin(a).toFloat() * rr),
                              Offset(c.x + cos(a).toFloat() * (rr + len), c.y + sin(a).toFloat() * (rr + len)),
                              strokeWidth = 1.5.dp.toPx(), cap = StrokeCap.Round
                          )
                      }
                  }

                  // Çekirdek
                  drawCircle(color.copy(alpha = 0.6f), r * 0.30f, c, style = Stroke(1.5.dp.toPx()))
                  drawCircle(
                      Brush.radialGradient(
                          listOf(Color.White, color.copy(alpha = 0.85f), color.copy(alpha = 0.15f), Color.Transparent),
                          center = c, radius = r * 0.30f
                      ),
                      radius = r * 0.28f * (1f + 0.05f * breathe + 0.12f * energy), center = c
                  )
                  val tri = Path().apply {
                      for (k in 0 until 3) {
                          val a = Math.toRadians(k * 120.0 - 90.0)
                          val x = c.x + cos(a).toFloat() * r * 0.17f
                          val y = c.y + sin(a).toFloat() * r * 0.17f
                          if (k == 0) moveTo(x, y) else lineTo(x, y)
                      }
                      close()
                  }
                  rotate(-spinSlow * 2f) {
                      drawPath(tri, Color.White.copy(alpha = 0.85f), style = Stroke(1.6.dp.toPx()))
                  }
                  drawCircle(Color.White, 2.5.dp.toPx(), c)
              }
          }

          @Composable
          fun WaveBars(active: Boolean, level: Float, color: Color) {
              val t = rememberInfiniteTransition(label = "wave")
              val ph by t.animateFloat(
                  0f, (2 * PI).toFloat(), infiniteRepeatable(tween(1200, easing = LinearEasing)), label = "ph"
              )
              val lv by animateFloatAsState(level, tween(100), label = "wlv")
              Canvas(Modifier.fillMaxWidth().height(28.dp).padding(horizontal = 40.dp)) {
                  val n = 36
                  val gap = size.width / n
                  val cy = size.height / 2f
                  for (i in 0 until n) {
                      val amp = if (active) (0.2f + 0.8f * abs(sin(ph + i * 0.45f))) * (0.4f + 0.6f * lv) else 0.07f
                      val h = size.height * amp
                      val x = gap * i + gap / 2f
                      drawLine(
                          color.copy(alpha = if (active) 0.9f else 0.25f),
                          Offset(x, cy - h / 2f), Offset(x, cy + h / 2f),
                          strokeWidth = 2.5.dp.toPx(), cap = StrokeCap.Round
                      )
                  }
              }
          }

          @Composable
          fun TypingDots() {
              val tr = rememberInfiniteTransition(label = "dots")
              val ph by tr.animateFloat(
                  0f, (2 * PI).toFloat(), infiniteRepeatable(tween(1000, easing = LinearEasing)), label = "dph"
              )
              Row(Modifier.padding(8.dp), horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                  for (i in 0 until 3) {
                      val a = 0.3f + 0.7f * abs(sin(ph - i * 0.8f))
                      Box(
                          Modifier
                              .size(8.dp)
                              .graphicsLayer {
                                  alpha = a
                                  scaleX = 0.6f + 0.5f * a
                                  scaleY = 0.6f + 0.5f * a
                              }
                              .background(CYAN, CircleShape)
                      )
                  }
              }
          }

          @Composable
          fun Bubble(chat: Chat) {
              val animate = remember(chat) {
                  val a = !chat.user && !chat.played
                  chat.played = true
                  a
              }
              var shown by remember { mutableIntStateOf(if (animate) 0 else chat.text.length) }
              LaunchedEffect(chat) {
                  while (shown < chat.text.length) {
                      delay(16)
                      shown++
                  }
              }
              var vis by remember { mutableStateOf(false) }
              LaunchedEffect(Unit) { vis = true }
              val a by animateFloatAsState(if (vis) 1f else 0f, tween(500, easing = FastOutSlowInEasing), label = "bubble")

              Row(
                  Modifier.fillMaxWidth().graphicsLayer {
                      alpha = a
                      translationY = (1f - a) * 36f
                  },
                  horizontalArrangement = if (chat.user) Arrangement.End else Arrangement.Start
              ) {
                  Column(
                      Modifier
                          .widthIn(max = 300.dp)
                          .background(
                              if (chat.user) Color(0xFF073B54) else PANEL.copy(alpha = 0.92f),
                              RoundedCornerShape(16.dp)
                          )
                          .border(1.dp, CYAN.copy(alpha = 0.22f), RoundedCornerShape(16.dp))
                          .padding(horizontal = 13.dp, vertical = 10.dp)
                  ) {
                      Text(
                          if (chat.user) "SEN" else "JARVIS",
                          color = CYAN, fontSize = 9.sp, fontWeight = FontWeight.Bold, letterSpacing = 1.5.sp
                      )
                      Spacer(Modifier.height(4.dp))
                      Text(chat.text.take(shown), color = WHITE, fontSize = 14.sp, lineHeight = 20.sp)
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/example/jarvis/Voice.kt <<'EOF'
          package com.example.jarvis

          import android.content.Context
          import android.content.Intent
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.speech.RecognitionListener
          import android.speech.RecognizerIntent
          import android.speech.SpeechRecognizer
          import android.speech.tts.TextToSpeech
          import android.speech.tts.UtteranceProgressListener
          import android.speech.tts.Voice

          class Speaker(private val context: Context) {
              private val main = Handler(Looper.getMainLooper())
              private var tts: TextToSpeech? = null
              private var ready = false

              init {
                  tts = TextToSpeech(context) { result ->
                      if (result == TextToSpeech.SUCCESS) {
                          tts?.language = TR
                          try {
                              val all = turkishVoices()
                              val saved = context.getSharedPreferences(PREF, 0).getString("voice_name", "") ?: ""
                              val pick = all.firstOrNull { it.name == saved } ?: pickFemale(all)
                              if (pick != null) tts?.voice = pick
                          } catch (_: Exception) {
                          }
                          ready = true
                      }
                  }
              }

              private fun pickFemale(vs: List<Voice>): Voice? {
                  fun score(v: Voice): Int {
                      val n = v.name.lowercase()
                      var s = v.quality
                      if (n.contains("tmc") || (n.contains("male") && !n.contains("female"))) s -= 1000
                      if (n.contains("female")) s += 200
                      if (n.contains("afs")) s += 150
                      if (n.contains("ama")) s += 60
                      return s
                  }
                  return vs.maxByOrNull { score(it) }
              }

              fun turkishVoices(): List<Voice> {
                  return try {
                      (tts?.voices ?: emptySet()).filter { it.locale.language == "tr" }.sortedBy { it.name }
                  } catch (_: Exception) {
                      emptyList()
                  }
              }

              fun useVoice(name: String): Boolean {
                  val vv = turkishVoices().firstOrNull { it.name == name } ?: return false
                  tts?.voice = vv
                  return true
              }

              fun speak(text: String, finished: (() -> Unit)? = null) {
                  val engine = tts
                  if (!ready || engine == null) {
                      finished?.let { main.post(it) }
                      return
                  }
                  val p = context.getSharedPreferences(PREF, 0)
                  engine.setSpeechRate(p.getFloat("rate_f", 0.96f))
                  engine.setPitch(p.getFloat("pitch_f", 1.12f))

                  // Cümle cümle okumak tonlamayı doğallaştırır, aralara kısa nefes payı konur.
                  val parts = text.replace(Regex("[*#_`~>]"), "").take(3500)
                      .split(Regex("(?<=[.!?…])\\s+"))
                      .map { it.trim() }
                      .filter { it.isNotEmpty() }
                  if (parts.isEmpty()) {
                      finished?.let { main.post(it) }
                      return
                  }

                  val base = "u" + System.nanoTime()
                  val lastId = base + "_last"

                  engine.setOnUtteranceProgressListener(object : UtteranceProgressListener() {
                      override fun onStart(utteranceId: String?) {
                          main.post {
                              Bus.state = JState.SPEAKING
                              Bus.level = 0.7f
                          }
                      }

                      override fun onDone(utteranceId: String?) {
                          if (utteranceId == lastId) {
                              main.post {
                                  Bus.level = 0f
                                  finished?.invoke()
                              }
                          }
                      }

                      @Deprecated("Deprecated in Java")
                      override fun onError(utteranceId: String?) {
                          if (utteranceId == lastId) {
                              main.post {
                                  Bus.level = 0f
                                  finished?.invoke()
                              }
                          }
                      }
                  })

                  parts.forEachIndexed { i, s ->
                      val last = i == parts.lastIndex
                      engine.speak(
                          s,
                          if (i == 0) TextToSpeech.QUEUE_FLUSH else TextToSpeech.QUEUE_ADD,
                          null,
                          if (last) lastId else base + "_" + i
                      )
                      if (!last) engine.playSilentUtterance(140, TextToSpeech.QUEUE_ADD, base + "_s" + i)
                  }
              }

              fun stop() {
                  tts?.stop()
              }

              fun shutdown() {
                  tts?.stop()
                  tts?.shutdown()
                  tts = null
              }
          }

          class Ears(
              private val context: Context,
              private val onPartial: (String) -> Unit,
              private val onResult: (String) -> Unit,
              private val onFail: (Int) -> Unit
          ) {
              private var rec: SpeechRecognizer? = null

              fun available(): Boolean = SpeechRecognizer.isRecognitionAvailable(context)

              fun start() {
                  if (rec == null) {
                      rec = SpeechRecognizer.createSpeechRecognizer(context)
                      rec?.setRecognitionListener(object : RecognitionListener {
                          override fun onReadyForSpeech(params: Bundle?) {}
                          override fun onBeginningOfSpeech() {}
                          override fun onRmsChanged(rmsdB: Float) {
                              Bus.level = rmsdB.coerceIn(0f, 10f) / 10f
                          }
                          override fun onBufferReceived(buffer: ByteArray?) {}
                          override fun onEndOfSpeech() {}
                          override fun onError(error: Int) {
                              Bus.level = 0f
                              onFail(error)
                          }
                          override fun onResults(results: Bundle?) {
                              Bus.level = 0f
                              val r = results?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)?.firstOrNull()
                              if (r.isNullOrBlank()) onFail(SpeechRecognizer.ERROR_NO_MATCH) else onResult(r)
                          }
                          override fun onPartialResults(partialResults: Bundle?) {
                              val r = partialResults?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)?.firstOrNull()
                              if (!r.isNullOrBlank()) onPartial(r)
                          }
                          override fun onEvent(eventType: Int, params: Bundle?) {}
                      })
                  }
                  val i = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                      putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                      putExtra(RecognizerIntent.EXTRA_LANGUAGE, "tr-TR")
                      putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, true)
                      putExtra(RecognizerIntent.EXTRA_MAX_RESULTS, 3)
                  }
                  rec?.startListening(i)
              }

              fun cancel() {
                  try {
                      rec?.cancel()
                  } catch (_: Exception) {
                  }
              }

              fun destroy() {
                  try {
                      rec?.destroy()
                  } catch (_: Exception) {
                  }
                  rec = null
              }
          }
          EOF

          cat > app/src/main/java/com/example/jarvis/VolumeKeyService.kt <<'EOF'
          package com.example.jarvis

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.AccessibilityServiceInfo
          import android.content.Intent
          import android.os.Handler
          import android.os.Looper
          import android.os.SystemClock
          import android.view.KeyEvent
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import androidx.core.content.ContextCompat

          class VolumeKeyService : AccessibilityService() {
              private var last = 0L
              private val main = Handler(Looper.getMainLooper())

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  serviceInfo = serviceInfo.apply {
                      flags = flags or AccessibilityServiceInfo.FLAG_REQUEST_FILTER_KEY_EVENTS or
                          AccessibilityServiceInfo.FLAG_REPORT_VIEW_IDS
                  }
              }

              override fun onKeyEvent(e: KeyEvent): Boolean {
                  if (e.keyCode == KeyEvent.KEYCODE_VOLUME_DOWN &&
                      e.action == KeyEvent.ACTION_DOWN &&
                      e.repeatCount == 0
                  ) {
                      val now = SystemClock.elapsedRealtime()
                      if (now - last < 700) {
                          last = 0
                          try {
                              ContextCompat.startForegroundService(
                                  this, Intent(this, JarvisService::class.java).setAction("LISTEN")
                              )
                          } catch (_: Exception) {
                          }
                          return true
                      }
                      last = now
                  }
                  return false
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  // Sadece Jarvis'in hazırladığı bir WhatsApp mesajı beklenirken çalışır.
                  if (SendState.until < SystemClock.elapsedRealtime()) return
                  val pkg = event?.packageName?.toString() ?: return
                  if (!pkg.startsWith("com.whatsapp")) return
                  val root = rootInActiveWindow ?: return
                  val btn = findSend(root) ?: return
                  if (btn.performAction(AccessibilityNodeInfo.ACTION_CLICK)) {
                      SendState.until = 0L
                      main.postDelayed({ performGlobalAction(GLOBAL_ACTION_HOME) }, 1200)
                  }
              }

              private fun findSend(node: AccessibilityNodeInfo): AccessibilityNodeInfo? {
                  for (id in listOf("com.whatsapp:id/send", "com.whatsapp.w4b:id/send")) {
                      val l = node.findAccessibilityNodeInfosByViewId(id)
                      if (!l.isNullOrEmpty()) return l[0]
                  }
                  return walk(node, 0)
              }

              private fun walk(n: AccessibilityNodeInfo, depth: Int): AccessibilityNodeInfo? {
                  if (depth > 25) return null
                  val d = n.contentDescription?.toString()?.lowercase() ?: ""
                  if (n.isClickable && (d == "gönder" || d == "send")) return n
                  for (i in 0 until n.childCount) {
                      val c = n.getChild(i) ?: continue
                      val r = walk(c, depth + 1)
                      if (r != null) return r
                  }
                  return null
              }

              override fun onInterrupt() {}
          }
