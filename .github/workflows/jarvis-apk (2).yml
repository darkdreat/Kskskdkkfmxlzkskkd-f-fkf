          private fun withA(color: Int, a: Int): Int = (color and 0x00FFFFFF) or (a.coerceIn(0, 255) shl 24)

          /** Ekranda yüzen küçük ark reaktörü. */
          class OrbView(ctx: android.content.Context) : View(ctx) {
              private val p = Paint(Paint.ANTI_ALIAS_FLAG)
              private val rect = RectF()
              private var rot = 0f
              private var breathe = 0f

              private val rotAnim = ValueAnimator.ofFloat(0f, 360f).apply {
                  duration = 7000
                  repeatCount = ValueAnimator.INFINITE
                  interpolator = LinearInterpolator()
                  addUpdateListener {
                      rot = it.animatedValue as Float
                      invalidate()
                  }
              }
              private val breatheAnim = ValueAnimator.ofFloat(0f, 1f).apply {
                  duration = 1800
                  repeatCount = ValueAnimator.INFINITE
                  repeatMode = ValueAnimator.REVERSE
                  addUpdateListener { breathe = it.animatedValue as Float }
              }

              override fun onAttachedToWindow() {
                  super.onAttachedToWindow()
                  rotAnim.start()
                  breatheAnim.start()
              }

              override fun onDetachedFromWindow() {
                  rotAnim.cancel()
                  breatheAnim.cancel()
                  super.onDetachedFromWindow()
              }

              override fun onDraw(c: Canvas) {
                  val accent = when (Bus.state) {
                      JState.THINKING -> 0xFFFFA726
                      JState.LISTENING -> 0xFF00E676
                      JState.WAKE -> 0xFFB388FF
                      else -> 0xFF00E5FF
                  }.toInt()
                  val cx = width / 2f
                  val cy = height / 2f
                  val r = minOf(cx, cy)

                  p.shader = null
                  p.style = Paint.Style.FILL
                  p.color = 0xEE030814.toInt()
                  c.drawCircle(cx, cy, r * 0.96f, p)

                  p.shader = RadialGradient(cx, cy, r, intArrayOf(withA(accent, 90), withA(accent, 0)), null, Shader.TileMode.CLAMP)
                  c.drawCircle(cx, cy, r, p)
                  p.shader = null

                  p.style = Paint.Style.STROKE
                  p.strokeWidth = r * 0.06f
                  p.color = withA(accent, 230)
                  c.drawCircle(cx, cy, r * 0.88f, p)

                  p.strokeWidth = r * 0.15f
                  p.color = withA(accent, 170 + (70 * breathe).toInt())
                  rect.set(cx - r * 0.58f, cy - r * 0.58f, cx + r * 0.58f, cy + r * 0.58f)
                  c.save()
                  c.rotate(rot, cx, cy)
                  for (i in 0 until 10) c.drawArc(rect, i * 36f + 5f, 26f, false, p)
                  c.restore()

                  p.style = Paint.Style.FILL
                  p.shader = RadialGradient(
                      cx, cy, r * 0.36f,
                      intArrayOf(0xFFFFFFFF.toInt(), withA(accent, 200), withA(accent, 0)),
                      floatArrayOf(0f, 0.55f, 1f), Shader.TileMode.CLAMP
                  )
                  c.drawCircle(cx, cy, r * (0.30f + 0.05f * breathe), p)
                  p.shader = null
              }
