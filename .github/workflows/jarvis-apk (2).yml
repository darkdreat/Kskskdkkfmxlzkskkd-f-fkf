                  else "${m.trigger} açılamadı. Uygulama yüklü olmayabilir ya da arka planda açma izni verilmemiş olabilir."
              }

              private suspend fun remote(ctx: Context, raw: String): String {
                  val p = ctx.getSharedPreferences(PREF, 0)
                  val key = p.getString("api_key", "") ?: ""
                  if (key.isBlank()) return "Bunu anlayamadım. Sohbet için Ayarlar bölümünden Groq API anahtarını girmen gerekiyor."
                  val name = userName(ctx)
                  return try {
                      val ans = askGroq(raw, key, name, Bus.history.takeLast(10).toList())
                      Bus.history.add("user" to raw)
                      Bus.history.add("assistant" to ans)
                      while (Bus.history.size > 20) Bus.history.removeAt(0)
                      ans
                  } catch (e: IllegalStateException) {
                      e.message ?: "Bir hata oluştu."
                  } catch (e: Exception) {
                      "Bağlantı kurulamadı. İnternetini kontrol et."
                  }
              }

              private suspend fun askGroq(
                  question: String,
                  apiKey: String,
                  name: String,
                  hist: List<Pair<String, String>>
              ): String = withContext(Dispatchers.IO) {
                  val msgs = JSONArray()
                  msgs.put(
                      JSONObject().put("role", "system").put(
                          "content",
                          "Sen JARVIS adlı Türkçe kişisel asistansın. Kullanıcıya '$name' diye hitap et. " +
                              "Sıcak, zarif, zeki ve doğal bir kadın asistan gibi konuş. Cevapların sesli okunacak; " +
                              "emoji, Markdown, liste veya başlık kullanma. Kısa cümleler kur. " +
                              "Yapmadığın işlemleri yaptığını söyleme. Genellikle 1-4 cümle yaz."
                      )
                  )
                  hist.forEach { msgs.put(JSONObject().put("role", it.first).put("content", it.second)) }
                  msgs.put(JSONObject().put("role", "user").put("content", question.take(4000)))

                  var lastCode = 0
                  var lastMsg = ""

                  for (model in MODELS) {
                      var conn: HttpURLConnection? = null
                      try {
                          val body = JSONObject().put("model", model).put("messages", msgs)
                              .put("temperature", 0.6).put("max_tokens", 400)

                          conn = URL("https://api.groq.com/openai/v1/chat/completions").openConnection() as HttpURLConnection
                          conn.requestMethod = "POST"
                          conn.connectTimeout = 15000
                          conn.readTimeout = 30000
                          conn.doOutput = true
                          conn.setRequestProperty("Authorization", "Bearer $apiKey")
                          conn.setRequestProperty("Content-Type", "application/json")
                          conn.outputStream.use { it.write(body.toString().toByteArray(Charsets.UTF_8)) }

                          val code = conn.responseCode
                          val stream = if (code in 200..299) conn.inputStream else conn.errorStream
                          val response = stream?.bufferedReader()?.use { it.readText() }.orEmpty()

                          if (code in 200..299) {
                              return@withContext JSONObject(response)
                                  .getJSONArray("choices").getJSONObject(0)
                                  .getJSONObject("message").getString("content").trim()
                          }

                          lastCode = code
                          lastMsg = try {
                              JSONObject(response).getJSONObject("error").getString("message")
                          } catch (_: Exception) {
                              ""
                          }

                          if (code == 401) throw IllegalStateException("API anahtarı geçersiz. Ayarlardan kontrol et.")
                          if (code == 429) throw IllegalStateException("Groq istek limiti doldu. Biraz sonra tekrar dene.")
                      } finally {
                          conn?.disconnect()
                      }
                  }
                  throw IllegalStateException(("Groq hatası, HTTP $lastCode. $lastMsg").take(200))
              }
          }
