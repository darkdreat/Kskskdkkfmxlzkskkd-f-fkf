                      val q = raw
                          .replace(Regex("(?i)(chrome|google|krom|youtube)(['’ ]?(da|de)\\b)?"), "")
                          .replace(Regex("(?i)\\b(ara|arat|arasana|aratsana|aratır)\\b"), "")
                          .replace(Regex("\\s+"), " ")
                          .trim()
                      if (q.isNotBlank()) {
                          val url = if (n.contains("youtube")) {
                              "https://www.youtube.com/results?search_query=" + Uri.encode(q)
                          } else {
                              "https://www.google.com/search?q=" + Uri.encode(q)
                          }
                          return try {
                              val i = Intent(Intent.ACTION_VIEW, Uri.parse(url)).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                              if (n.contains("chrome")) i.setPackage("com.android.chrome")
                              try {
