name: JARVIS APK derle

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android proje dosyalarini olustur
        run: |
          mkdir -p app app/src/main app/src/main/java/com/example/jarvis app/src/main/res/drawable app/src/main/res/mipmap-anydpi-v26 app/src/main/res/values app/src/main/res/xml

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "JarvisAI"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.example.jarvis"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.example.jarvis"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 5
                  versionName = "5.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              buildFeatures {
                  compose = true
              }
          }

          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.12.01"))
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.activity:activity-compose:1.10.0")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.animation:animation")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.7")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0")
          }
          EOF

          cat > app/src/main/res/values/themes.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#00E5FF</item>
                  <item name="android:statusBarColor">#030814</item>
                  <item name="android:navigationBarColor">#030814</item>
                  <item name="android:windowBackground">#030814</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="vol_desc">Ses kisma tusuna iki kez basinca Jarvis dinlemeye baslar. WhatsApp mesajini onayladiktan sonra gonder tusuna otomatik basar.</string>
          </resources>
          EOF

          cat > app/src/main/res/xml/volume_service.xml <<'EOF'
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagRequestFilterKeyEvents|flagReportViewIds"
              android:canRequestFilterKeyEvents="true"
              android:canRetrieveWindowContent="true"
              android:notificationTimeout="200"
              android:description="@string/vol_desc"/>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"/>
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="com.android.alarm.permission.SET_ALARM"/>
              <uses-permission android:name="android.permission.KILL_BACKGROUND_PROCESSES"/>
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES"/>
              <uses-permission android:name="android.permission.WRITE_SETTINGS"/>

              <queries>
                  <package android:name="com.whatsapp"/>
                  <package android:name="com.whatsapp.w4b"/>
                  <intent>
                      <action android:name="android.speech.RecognitionService"/>
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.TTS_SERVICE"/>
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.MAIN"/>
                      <category android:name="android.intent.category.LAUNCHER"/>
                  </intent>
              </queries>

              <application
                  android:allowBackup="false"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:label="JARVIS"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".FloatingService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="floating_assistant_button"/>
                  </service>

                  <service
                      android:name=".JarvisService"
                      android:exported="false"
                      android:foregroundServiceType="microphone"/>

                  <service
                      android:name=".VolumeKeyService"
                      android:exported="true"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService"/>
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/volume_service"/>
                  </service>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/drawable/ic_launcher_fg.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#1800D9FF" android:pathData="M54,54 m-43,0 a43,43 0 1,0 86,0 a43,43 0 1,0 -86,0"/>
              <path android:strokeColor="#6600E5FF" android:strokeWidth="1.4" android:fillColor="#00000000"
                  android:pathData="M54,8 A46,46 0 1,1 53.9,8 M54,15 A39,39 0 1,0 54.1,15"/>
              <path android:strokeColor="#00E5FF" android:strokeWidth="2.8" android:fillColor="#00000000"
                  android:pathData="M54,17 A37,37 0 0,1 87,37 M91,54 A37,37 0 0,1 71,87 M54,91 A37,37 0 0,1 21,71 M17,54 A37,37 0 0,1 37,21"/>
              <path android:strokeColor="#B300E5FF" android:strokeWidth="2" android:fillColor="#00000000"
                  android:pathData="M54,27 A27,27 0 1,1 53.9,27 M54,34 A20,20 0 1,0 54.1,34"/>
              <path android:fillColor="#00E5FF" android:pathData="M54,54 m-8,0 a8,8 0 1,0 16,0 a8,8 0 1,0 -16,0"/>
              <path android:fillColor="#FFFFFF" android:pathData="M54,54 m-3,0 a3,3 0 1,0 6,0 a3,3 0 1,0 -6,0"/>
          </vector>
          EOF

          cat > app/src/main/res/drawable/ic_launcher_bg.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#030814" android:pathData="M0,0h108v108h-108z"/>
          </vector>
          EOF

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_bg"/>
              <foreground android:drawable="@drawable/ic_launcher_fg"/>
          </adaptive-icon>
          EOF

          cat > app/src/main/java/com/example/jarvis/Actions.kt <<'EOF'
          package com.example.jarvis

          import android.app.ActivityManager
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ApplicationInfo
          import android.media.AudioManager
          import android.net.Uri
          import android.os.BatteryManager
          import android.os.SystemClock
          import android.provider.AlarmClock
          import android.provider.Settings
          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.mutableStateOf
          import androidx.compose.runtime.setValue
          import kotlinx.coroutines.delay
          import org.json.JSONArray
          import org.json.JSONObject
          import java.util.Calendar

          data class Contact(val name: String, val number: String)

          object SendState {
              @Volatile
              var until = 0L
          }

          object Flags {
              var floating by mutableStateOf(false)
          }

          /** Onay bekleyen WhatsApp mesajı. Gönderme ancak "evet" denince yapılır. */
          object Pending {
              var active = false
              var name = ""
              var number = ""
              var text = ""

              fun set(n: String, num: String, t: String) {
                  active = true
                  name = n
                  number = num
                  text = t
              }

              fun clear() {
                  active = false
              }
          }

          fun loadContacts(ctx: Context): List<Contact> {
              val raw = ctx.getSharedPreferences(PREF, 0).getString("contacts", null) ?: return emptyList()
              return try {
                  val a = JSONArray(raw)
                  List(a.length()) {
                      val o = a.getJSONObject(it)
                      Contact(o.getString("name"), o.getString("number"))
                  }
              } catch (_: Exception) {
                  emptyList()
              }
          }

          fun saveContacts(ctx: Context, list: List<Contact>) {
              val a = JSONArray()
              list.forEach { a.put(JSONObject().put("name", it.name).put("number", it.number)) }
              ctx.getSharedPreferences(PREF, 0).edit().putString("contacts", a.toString()).apply()
          }

          fun waNumber(s: String): String {
              val d = s.filter { it.isDigit() }
              return when {
                  d.startsWith("00") -> d.drop(2)
                  d.startsWith("90") && d.length == 12 -> d
                  d.startsWith("0") && d.length == 11 -> "90" + d.drop(1)
                  d.length == 10 -> "90" + d
                  else -> d
              }
          }

          fun waIntent(ctx: Context, number: String, text: String): Intent {
              val uri = Uri.parse("https://api.whatsapp.com/send?phone=" + waNumber(number) + "&text=" + Uri.encode(text))
              val i = Intent(Intent.ACTION_VIEW, uri).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
              val pm = ctx.packageManager
              if (pm.getLaunchIntentForPackage("com.whatsapp") != null) {
                  i.setPackage("com.whatsapp")
              } else if (pm.getLaunchIntentForPackage("com.whatsapp.w4b") != null) {
                  i.setPackage("com.whatsapp.w4b")
              }
              return i
          }

          fun sendNow(ctx: Context, number: String, text: String): Boolean {
              SendState.until = SystemClock.elapsedRealtime() + 120_000L
              return try {
                  ctx.startActivity(waIntent(ctx, number, text))
                  true
              } catch (_: Exception) {
                  SendState.until = 0L
                  false
              }
          }

          fun a11yEnabled(ctx: Context): Boolean {
              val s = Settings.Secure.getString(ctx.contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES)
                  ?: return false
              return s.contains(ctx.packageName + "/")
          }

          fun fmtClock(h: Int, m: Int): String = String.format(TR, "%02d:%02d", h, m)

          object Actions {

              private val NUM = mapOf(
                  "sifir" to 0, "bir" to 1, "iki" to 2, "uc" to 3, "dort" to 4, "bes" to 5,
                  "alti" to 6, "yedi" to 7, "sekiz" to 8, "dokuz" to 9, "on" to 10,
                  "yirmi" to 20, "otuz" to 30, "kirk" to 40, "elli" to 50, "altmis" to 60
              )

              private val SUFFIX = setOf("e", "a", "ye", "ya", "ne", "na", "den", "dan")

              private val WAKE_RAW = Regex("(?i)^\\s*(hey|hay|ey)?\\s*(jarvis|carvis|harvis|cervis|javis|jar vis)[,.!]*\\s*")

              private val YES = setOf("evet", "evet gonder", "gonder", "onayla", "olur", "tamam", "yolla", "evet yolla", "evet at", "he")
              private val NO = setOf("hayir", "iptal", "vazgec", "gonderme", "olmaz", "hayir gonderme", "yok")

              suspend fun handle(ctx: Context, n: String, raw: String): String? =
                  confirm(ctx, n) ?: optimizeCmd(ctx, n) ?: timer(ctx, n) ?: alarm(ctx, n) ?: quick(ctx, n) ?: whatsapp(ctx, n, raw)

              // ---------- sayılar ve saat ----------

              private fun digits(n: String): String {
                  val out = ArrayList<String>()
                  var acc = -1
                  for (t in n.split(" ")) {
                      val v = NUM[t]
                      if (v != null) {
                          acc = when {
                              acc < 0 -> v
                              acc >= 20 && acc % 10 == 0 && v in 1..9 -> acc + v
                              else -> {
                                  out.add(acc.toString())
                                  v
                              }
                          }
                      } else {
                          if (acc >= 0) {
                              out.add(acc.toString())
                              acc = -1
                          }
                          out.add(t)
                      }
                  }
                  if (acc >= 0) out.add(acc.toString())
                  return out.joinToString(" ")
              }

              private fun parseClock(src: String): Pair<Int, Int>? {
                  val n = digits(src)
                  val a = Regex("\\b(\\d{1,2}) (\\d{2})\\b").find(n)
                  var h: Int
                  val m: Int
                  if (a != null) {
                      h = a.groupValues[1].toInt()
                      m = a.groupValues[2].toInt()
                  } else {
                      val b = Regex("\\b(\\d{1,2})\\b( bucuk)?").find(n) ?: return null
                      h = b.groupValues[1].toInt()
                      m = if (b.groupValues[2].isNotEmpty()) 30 else 0
                  }
                  val pm = Regex("\\b(aksam|ogleden sonra)\\b").containsMatchIn(n)
                  if (pm && h in 1..11) h += 12 else if (n.contains("gece") && h in 6..11) h += 12
                  if (h !in 0..23 || m !in 0..59) return null
                  return Pair(h, m)
              }

              private fun durationSec(n: String): Int {
                  var total = 0
                  Regex("\\b(\\d{1,3}) (saat|dakika|dk|saniye|sn)\\b").findAll(digits(n)).forEach {
                      val v = it.groupValues[1].toInt()
                      total += when (it.groupValues[2]) {
                          "saat" -> v * 3600
                          "dakika", "dk" -> v * 60
                          else -> v
                      }
                  }
                  return total
              }

              private fun spokenDuration(sec: Int): String {
                  val h = sec / 3600
                  val m = (sec % 3600) / 60
                  val s = sec % 60
                  val parts = ArrayList<String>()
                  if (h > 0) parts.add("$h saat")
                  if (m > 0) parts.add("$m dakika")
                  if (s > 0) parts.add("$s saniye")
                  return parts.joinToString(" ")
              }

              // ---------- zamanlayıcı ----------

              private fun timer(ctx: Context, n: String): String? {
                  val sec = durationSec(n)
                  val wants = n.contains("zamanlayici") || n.contains("sayac") || n.contains("geri sayim")
                  val relative = n.contains("sonra") && sec > 0 &&
                      (n.contains("uyar") || n.contains("hatirlat") || n.contains("uyandir") || n.contains("alarm"))
                  if (!wants && !relative) return null
                  if (sec <= 0) return "Kaç dakikalık zamanlayıcı kurayım?"
                  return try {
                      val i = Intent(AlarmClock.ACTION_SET_TIMER)
                          .putExtra(AlarmClock.EXTRA_LENGTH, sec)
                          .putExtra(AlarmClock.EXTRA_MESSAGE, "Jarvis")
                          .putExtra(AlarmClock.EXTRA_SKIP_UI, true)
                          .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      ctx.startActivity(i)
                      spokenDuration(sec) + " için zamanlayıcı kuruldu."
                  } catch (_: Exception) {
                      "Zamanlayıcı kurulamadı. Saat uygulaması bulunamadı ya da izin verilmedi."
                  }
              }

              // ---------- alarm ----------

              private fun setAlarm(ctx: Context, h: Int, m: Int, label: String, days: List<Int>?): Boolean {
                  return try {
                      val i = Intent(AlarmClock.ACTION_SET_ALARM)
                          .putExtra(AlarmClock.EXTRA_HOUR, h)
                          .putExtra(AlarmClock.EXTRA_MINUTES, m)
                          .putExtra(AlarmClock.EXTRA_MESSAGE, label)
                          .putExtra(AlarmClock.EXTRA_SKIP_UI, true)
                          .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      if (days != null) i.putIntegerArrayListExtra(AlarmClock.EXTRA_DAYS, ArrayList(days))
                      ctx.startActivity(i)
                      true
                  } catch (_: Exception) {
                      false
                  }
              }

              private val WEEKDAYS = listOf(
                  Calendar.MONDAY, Calendar.TUESDAY, Calendar.WEDNESDAY, Calendar.THURSDAY, Calendar.FRIDAY
              )

              private fun schoolAlarm(ctx: Context): String {
                  val p = ctx.getSharedPreferences(PREF, 0)
                  val st = p.getString("school", null)
                      ?: return "Okul saatini bilmiyorum. 'Okul saatim 9' de, sonra tekrar iste."
                  val prep = p.getInt("prep", 90)
                  val mm = Regex("(\\d{1,2}):(\\d{2})").find(st) ?: return "Okul saati geçersiz."
                  val total = ((mm.groupValues[1].toInt() * 60 + mm.groupValues[2].toInt() - prep) % 1440 + 1440) % 1440
                  val h = total / 60
                  val m = total % 60
                  return if (setAlarm(ctx, h, m, "Okul", WEEKDAYS)) {
                      "Okul $st de başlıyor. Hazırlanman için $prep dakika pay bıraktım, alarmı " +
                          fmtClock(h, m) + " olarak hafta içi her gün kurdum."
                  } else "Alarm kurulamadı. Saat uygulaması bulunamadı ya da izin verilmedi."
              }

              private fun alarm(ctx: Context, n: String): String? {
                  val clock = parseClock(n)
                  if (n.contains("okul saat") && clock != null) {
                      val t = fmtClock(clock.first, clock.second)
                      ctx.getSharedPreferences(PREF, 0).edit().putString("school", t).apply()
                      return if (!n.contains("alarm")) "Okul saatini $t olarak kaydettim."
                      else "Okul saatini $t olarak kaydettim. " + schoolAlarm(ctx)
                  }

                  if (!n.contains("alarm")) return null

                  if (Regex("\\b(kapat|sil|iptal)\\b").containsMatchIn(n)) {
                      return try {
                          ctx.startActivity(Intent(AlarmClock.ACTION_SHOW_ALARMS).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                          "Alarmları yönetebilmen için saat uygulamasını açıyorum."
                      } catch (_: Exception) {
                          "Saat uygulaması açılamadı."
                      }
                  }

                  if (n.contains("okul")) return schoolAlarm(ctx)
                  if (clock == null) return "Alarmı saat kaça kurayım?"

                  val days: List<Int>? = when {
                      n.contains("hafta ici") -> WEEKDAYS
                      n.contains("her gun") -> listOf(1, 2, 3, 4, 5, 6, 7)
                      else -> null
                  }
                  return if (setAlarm(ctx, clock.first, clock.second, "Jarvis", days)) {
                      "Alarm " + fmtClock(clock.first, clock.second) + " için kuruldu."
                  } else "Alarm kurulamadı. Saat uygulaması bulunamadı ya da izin verilmedi."
              }

              // ---------- optimizasyon ----------

              private fun freeMb(am: ActivityManager): Int {
                  val mi = ActivityManager.MemoryInfo()
                  am.getMemoryInfo(mi)
                  return (mi.availMem / 1048576L).toInt()
              }

              suspend fun runOptimize(ctx: Context): String {
                  val am = ctx.getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager
                  val before = freeMb(am)
                  val keep = setOf(
                      "com.whatsapp", "com.whatsapp.w4b", "org.telegram.messenger",
                      "com.facebook.orca", "com.instagram.android", "com.spotify.music"
                  )
                  val apps: List<ApplicationInfo> = try {
                      ctx.packageManager.getInstalledApplications(0)
                  } catch (_: Exception) {
                      emptyList()
                  }
                  for (a in apps) {
                      if (a.packageName == ctx.packageName || a.packageName in keep) continue
                      if ((a.flags and ApplicationInfo.FLAG_SYSTEM) != 0) continue
                      try {
                          am.killBackgroundProcesses(a.packageName)
                      } catch (_: Exception) {
                      }
                  }
                  delay(1200)
                  val after = freeMb(am)

                  var extra = ""
                  try {
                      if (Settings.System.canWrite(ctx)) {
                          val cur = Settings.System.getInt(ctx.contentResolver, Settings.System.SCREEN_OFF_TIMEOUT, 60000)
                          if (cur > 30000) {
                              Settings.System.putInt(ctx.contentResolver, Settings.System.SCREEN_OFF_TIMEOUT, 30000)
                              extra += " Ekran zaman aşımını 30 saniyeye aldım."
                          }
                      } else {
                          extra += " Ekran zaman aşımını kısabilmem için Araçlar bölümünden ayar değiştirme iznini ver."
                      }
                  } catch (_: Exception) {
                  }

                  val bm = ctx.getSystemService(Context.BATTERY_SERVICE) as BatteryManager
                  val pct = bm.getIntProperty(BatteryManager.BATTERY_PROPERTY_CAPACITY)
                  val memText = if (after > before) "Boş bellek $before MB'tan $after MB'a çıktı."
                  else "Boş bellek şu an yaklaşık $after MB."
                  return "Optimizasyon tamamlandı. Arka plandaki uygulamalar temizlendi. $memText$extra Pil yüzde $pct."
              }

              private suspend fun optimizeCmd(ctx: Context, n: String): String? {
                  if (n.contains("pil tasarruf")) {
                      return try {
                          ctx.startActivity(Intent(Settings.ACTION_BATTERY_SAVER_SETTINGS).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                          "Pil tasarruf ayarını açıyorum."
                      } catch (_: Exception) {
                          "Pil tasarruf ayarı açılamadı."
                      }
                  }
                  val hit = n.contains("optimiz") || n.contains("ram temizle") ||
                      n.contains("bellegi temizle") || n.contains("telefonu hizlandir")
                  if (!hit) return null
                  return runOptimize(ctx)
              }

              // ---------- küçük ekstralar ----------

              private fun quick(ctx: Context, n: String): String? {
                  fun open(i: Intent): Boolean = try {
                      ctx.startActivity(i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                      true
                  } catch (_: Exception) {
                      false
                  }

                  if (n.contains("sesi ")) {
                      val up = n.contains("arttir") || n.contains("yukselt") || n.contains("ac")
                      val down = n.contains("kis") || n.contains("azalt") || n.contains("alcalt")
                      if (up || down) {
                          val am = ctx.getSystemService(Context.AUDIO_SERVICE) as AudioManager
                          repeat(3) {
                              am.adjustStreamVolume(
                                  AudioManager.STREAM_MUSIC,
                                  if (down) AudioManager.ADJUST_LOWER else AudioManager.ADJUST_RAISE,
                                  if (it == 2) AudioManager.FLAG_SHOW_UI else 0
                              )
                          }
                          return if (down) "Ses kısıldı." else "Ses artırıldı."
                      }
                  }
                  if (n.contains("wifi") && n.contains("ayar")) {
                      return if (open(Intent(Settings.ACTION_WIFI_SETTINGS))) "Wi-Fi ayarlarını açıyorum." else "Açılamadı."
                  }
                  if (n.contains("bluetooth") && n.contains("ayar")) {
                      return if (open(Intent(Settings.ACTION_BLUETOOTH_SETTINGS))) "Bluetooth ayarlarını açıyorum." else "Açılamadı."
                  }
                  if (Regex("\\b(ara|arasana|aratir misin)\\b").containsMatchIn(n) &&
                      !n.contains("google") && !n.contains("youtube") && !n.contains("chrome")
                  ) {
                      val c = findContact(ctx, n) ?: return null
                      return if (open(Intent(Intent.ACTION_DIAL, Uri.parse("tel:" + Uri.encode(c.number))))) {
                          c.name + " için arama ekranını açtım, yeşil tuşa basman yeterli."
                      } else "Arama ekranı açılamadı."
                  }
                  return null
              }

              // ---------- WhatsApp ----------

              private fun candidates(name: String): List<String> {
                  val nm = normalize(name)
                  val out = ArrayList<String>()
                  if (nm.isNotBlank()) out.add(nm)
                  val first = nm.substringBefore(" ")
                  if (first != nm && first.length >= 3) out.add(first)
                  for (c in ArrayList(out)) {
                      if (c.length >= 4 && c.endsWith("m") && !c.contains(" ")) out.add(c.dropLast(1))
                  }
                  return out.filter { it.length >= 3 }
              }

              private fun findContact(ctx: Context, n: String): Contact? {
                  var best: Contact? = null
                  var bestPos = Int.MAX_VALUE
                  var bestLen = 0
                  for (c in loadContacts(ctx)) {
                      for (cand in candidates(c.name)) {
                          val m = Regex("(^| )" + Regex.escape(cand)).find(n) ?: continue
                          val pos = m.range.first
                          if (pos < bestPos || (pos == bestPos && cand.length > bestLen)) {
                              best = c
                              bestPos = pos
                              bestLen = cand.length
                          }
                      }
                  }
                  return best
              }

              private fun dropContact(t: String, c: Contact): String {
                  val words = normalize(c.name).split(" ").filter { it.isNotBlank() }
                  if (words.isEmpty()) return t
                  val first = words[0]
                  val stem = if (words.size == 1 && first.length >= 4 && first.endsWith("m")) first.dropLast(1) else first
                  val toks = t.split(Regex("\\s+")).toMutableList()
                  val idx = toks.indexOfFirst {
                      val x = normalize(it)
                      x.startsWith(first) || (stem.length >= 3 && x.startsWith(stem))
                  }
                  if (idx < 0) return t
                  toks.removeAt(idx)
                  var k = 1
                  while (k < words.size && idx < toks.size && normalize(toks[idx]).startsWith(words[k])) {
                      toks.removeAt(idx)
                      k++
                  }
                  if (idx < toks.size && normalize(toks[idx]) in SUFFIX) toks.removeAt(idx)
                  return toks.joinToString(" ")
              }

              private fun extractMessage(raw: String, c: Contact): String {
                  var t = raw.trim().replace(WAKE_RAW, "")

                  // "Ahmet'e şunu yaz: yarın görüşelim" biçimi
                  val trig = Regex("(?i)(şunu|sunu|şöyle|soyle|şu mesajı|su mesaji)\\s+(yaz|at|gönder|gonder|yolla|söyle)?[\\s:,\\-]*").find(t)
                  if (trig != null) return t.substring(trig.range.last + 1).trim()

                  t = dropContact(t, c)
                  t = t.replace(Regex("(?i)\\b(whatsapp|vatsap|watsap|whatsap)\\S*"), " ")
                  t = t.replace(Regex("(?i)\\b(mesajı|mesaji|mesaj)\\b"), " ")
                  t = t.replace(Regex("(?i)\\s+(yaz|yazsana|yolla|gönder|gonder|ilet|söyle|soyle|de|diye)\\s*[.!]?\\s*$"), " ")
                  return t.replace(Regex("\\s+"), " ").trim(' ', '.', ',', ':', '"')
              }

              private fun whatsapp(ctx: Context, n: String, raw: String): String? {
                  val verb = Regex("\\b(yaz|yazsana|gonder|yolla|ilet|mesaj)\\b").containsMatchIn(n)
                  if (!verb) return null
                  val c = findContact(ctx, n)
                  if (c == null) {
                      return if (n.contains("whatsapp")) {
                          "Bu kişiyi rehberimde bulamadım. Araçlar bölümünden kişiyi ekler misin?"
                      } else null
                  }
                  val msg = extractMessage(raw, c)
                  if (msg.isBlank()) return c.name + " için ne yazayım?"
                  Pending.set(c.name, c.number, msg)
                  return c.name + " kişisine \"" + msg + "\" mesajını WhatsApp'tan göndereyim mi? Evet ya da hayır de."
              }

              private fun confirm(ctx: Context, n: String): String? {
                  if (!Pending.active) return null
                  if (n in NO) {
                      Pending.clear()
                      return "Tamam, göndermedim."
                  }
                  if (n in YES) {
                      val name = Pending.name
                      val ok = sendNow(ctx, Pending.number, Pending.text)
                      Pending.clear()
                      return when {
                          !ok -> "WhatsApp açılamadı. Yüklü olduğundan emin ol."
                          a11yEnabled(ctx) -> "$name kişisine gönderiyorum."
                          else -> "Mesajı hazırladım ama otomatik gönderme için erişilebilirlik servisi kapalı. Gönder tuşuna sen bas."
                      }
                  }
                  Pending.clear()
                  return null
              }
          }
