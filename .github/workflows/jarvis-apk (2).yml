          package com.example.jarvis

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.os.Build
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.os.PowerManager
          import android.speech.SpeechRecognizer
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.SupervisorJob
          import kotlinx.coroutines.cancel
          import kotlinx.coroutines.launch

          class JarvisService : Service() {

              private val main = Handler(Looper.getMainLooper())
              private val scope = CoroutineScope(Dispatchers.Main + SupervisorJob())
              private lateinit var speaker: Speaker
              private lateinit var ears: Ears
              private var wakeLock: PowerManager.WakeLock? = null
              private var commandMode = false
              private var busy = false
              private var alive = true

              private val alwaysOn: Boolean
                  get() = getSharedPreferences(PREF, 0).getBoolean("always", false)

              private val wakes = listOf(
                  "jarvis", "carvis", "harvis", "cervis", "javis",
                  "jar vis", "car vis", "char vis"
              )

              private val stopPhrases = setOf(
                  "tamam", "sus", "gorusuruz", "tesekkurler", "tesekkur ederim",
                  "yeter", "hepsi bu kadar", "tamam sagol", "sagol"
              )

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  try {
                      val n = buildNotif()
                      if (Build.VERSION.SDK_INT >= 29) {
                          startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE)
                      } else {
                          startForeground(1, n)
                      }
                  } catch (e: Exception) {
                      stopSelf()
                      return
                  }

                  val pm = getSystemService(POWER_SERVICE) as PowerManager
                  wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "jarvis:wake").apply {
                      if (alwaysOn) acquire() else acquire(10 * 60 * 1000L)
                  }

                  speaker = Speaker(this)
                  ears = Ears(this, onPartial = { onPartial(it) }, onResult = { onFinal(it) }, onFail = { onFail(it) })
                  Bus.serviceRunning = true
                  if (alwaysOn) main.postDelayed({ listenWake() }, 1200)
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent?.action == "STOP") {
                      stopSelf()
                      return START_NOT_STICKY
                  }
                  if (intent?.action == "LISTEN" && this::ears.isInitialized) {
                      main.removeCallbacksAndMessages(null)
                      main.postDelayed({
                          busy = false
                          handleWake("jarvis")
                      }, 800)
                  }
                  return if (alwaysOn) START_STICKY else START_NOT_STICKY
              }

              override fun onDestroy() {
                  alive = false
                  main.removeCallbacksAndMessages(null)
                  scope.cancel()
                  if (this::ears.isInitialized) ears.destroy()
                  if (this::speaker.isInitialized) speaker.shutdown()
                  try {
                      wakeLock?.release()
                  } catch (_: Exception) {
                  }
                  Bus.serviceRunning = false
                  Bus.state = JState.IDLE
                  Bus.level = 0f
                  super.onDestroy()
              }

              private fun idle() {
                  if (alwaysOn) listenWake() else stopSelf()
              }

              private fun buildNotif(): Notification {
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(NotificationChannel("jarvis", "Jarvis dinleme", NotificationManager.IMPORTANCE_LOW))
                  val open = PendingIntent.getActivity(this, 0, Intent(this, MainActivity::class.java), PendingIntent.FLAG_IMMUTABLE)
                  val stop = PendingIntent.getService(
                      this, 1, Intent(this, JarvisService::class.java).setAction("STOP"), PendingIntent.FLAG_IMMUTABLE
                  )
                  return Notification.Builder(this, "jarvis")
                      .setContentTitle("JARVIS dinliyor")
                      .setContentText("Ses tuşuna 2 kez bas ya da \"Hey Jarvis\" de")
                      .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                      .setContentIntent(open)
                      .addAction(android.R.drawable.ic_menu_close_clear_cancel, "Durdur", stop)
                      .build()
              }

              private fun listenWake() {
                  if (!alive) return
                  commandMode = false
                  busy = false
                  Bus.state = JState.WAKE
                  Bus.level = 0f
                  try {
                      ears.start()
                  } catch (e: Exception) {
                      retry(1500)
                  }
              }

              private fun listenCommand() {
                  if (!alive) return
                  commandMode = true
                  busy = false
                  Bus.state = JState.LISTENING
                  try {
                      ears.start()
                  } catch (e: Exception) {
                      retry(1500)
                  }
              }

              private fun retry(ms: Long) {
                  main.postDelayed({ if (commandMode) listenCommand() else listenWake() }, ms)
              }

              private fun hasWake(n: String) = wakes.any { n.contains(it) }

              private fun onPartial(text: String) {
                  if (!commandMode && !busy && hasWake(normalize(text))) handleWake(text)
              }

              private fun onFinal(text: String) {
                  if (busy) return
                  if (commandMode) {
                      process(text)
                  } else if (hasWake(normalize(text))) {
                      handleWake(text)
                  } else {
                      retry(250)
                  }
              }

              private fun onFail(error: Int) {
                  if (busy || !alive) return
                  if (error == SpeechRecognizer.ERROR_INSUFFICIENT_PERMISSIONS) {
                      stopSelf()
                      return
                  }
                  val delay = when (error) {
                      SpeechRecognizer.ERROR_SPEECH_TIMEOUT, SpeechRecognizer.ERROR_NO_MATCH -> 250L
                      SpeechRecognizer.ERROR_RECOGNIZER_BUSY -> 1000L
                      else -> 2000L
                  }
                  commandMode = false
                  Bus.state = JState.WAKE
                  main.postDelayed({ idle() }, delay)
              }

              private fun handleWake(text: String) {
                  if (busy) return
                  busy = true
                  ears.cancel()
                  val n = normalize(text)
                  var cut = -1
                  for (w in wakes) {
                      val i = n.indexOf(w)
                      if (i >= 0) {
                          cut = i + w.length
                          break
                      }
                  }
                  val rest = if (cut in 0..text.length) text.substring(cut).trim() else ""
                  if (rest.length >= 3 && normalize(rest).length >= 3) {
                      process(rest)
                  } else {
                      Bus.state = JState.SPEAKING
                      speaker.speak("Dinliyorum ${userName(this)}") { listenCommand() }
                  }
              }

              private fun process(text: String) {
                  busy = true
                  ears.cancel()
                  val n = normalize(text)

                  if (n.contains("dinlemeyi kapat") || n.contains("uyku modu") || n.contains("kendini kapat")) {
                      getSharedPreferences(PREF, 0).edit().putBoolean("always", false).apply()
                      speaker.speak("Dinleme modu kapatılıyor. İyi günler ${userName(this)}.") { stopSelf() }
                      return
                  }

                  // Onay beklerken "tamam" bir konuşmayı bitirme değil, onay sayılır.
                  if (!Pending.active && (n in stopPhrases || n.startsWith("gorusuruz"))) {
                      speaker.speak("Tamam, çağırdığında buradayım.") { idle() }
                      return
                  }

                  scope.launch {
                      val answer = Brain.respond(this@JarvisService, text)
                      Bus.state = JState.SPEAKING
                      speaker.speak(answer) { listenCommand() }
                  }
              }
          }
