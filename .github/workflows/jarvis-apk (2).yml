              private fun builtin(ctx: Context, n: String): String? {
                  val words = n.split(" ")
                  return when {
                      n.contains("saat kac") || n.contains("saati soyle") ->
                          "Saat şu an " + SimpleDateFormat("HH:mm", TR).format(Date()) + "."

                      n.contains("tarih") || n.contains("hangi gun") ||
                          n.contains("bugun gunlerden") || n.contains("bugun ayin kaci") ->
                          "Bugün " + SimpleDateFormat("d MMMM yyyy, EEEE", TR).format(Date()) + "."

