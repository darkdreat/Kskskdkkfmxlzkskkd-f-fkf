                              } catch (_: Exception) {
                                  i.setPackage(null)
                                  ctx.startActivity(i)
                              }
                              "$q aranıyor."
                          } catch (_: Exception) {
                              "Arama açılamadı."
                          }
                      }
                  }

                  val m = loadCommands(ctx).firstOrNull {
                      val t = normalize(it.trigger)
                      n == t || (n.contains(t) && (tokens.size <= 3 || tokens.any { w -> w in OPEN_WORDS }))
                  } ?: return null
