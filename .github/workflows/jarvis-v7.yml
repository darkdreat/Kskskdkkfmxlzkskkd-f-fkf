name: JARVIS v7 APK derle

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Proje dosyalarini hazirla
        run: |
          python3 - <<'PY'
          import glob, io, sys
          A = "Android proje dosyalarini " + "olustur"
          Z = "cat > app/src/main/java/com/example/jarvis/Act" + "ions.kt"
          body = None
          for p in sorted(glob.glob(".github/workflows/*.y*ml")):
              lines = io.open(p, encoding="utf-8").read().split("\n")
              text = "\n".join(lines)
              if A not in text or Z not in text:
                  continue
              start = None
              for i, l in enumerate(lines):
                  if A in l and l.strip().startswith("- name"):
                      start = i
                      break
              if start is None:
                  continue
              j = start + 1
              while j < len(lines) and not lines[j].strip().startswith("run:"):
                  j += 1
              j += 1
              out = []
              while j < len(lines):
                  l = lines[j]
                  if l.strip() and (len(l) - len(l.lstrip(" "))) < 10:
                      break
                  out.append(l[10:] if l.strip() else "")
                  j += 1
              body = "\n".join(out)
              break
          if body is None:
              sys.exit("HATA: eski JARVIS workflow dosyasi (.github/workflows) bulunamadi. Onu silme ya da degistirme.")
          io.open("/tmp/step1.sh", "w", encoding="utf-8").write(body + "\n")
          print("Eski workflowdan proje dosyalari alindi.")
          PY
          bash /tmp/step1.sh

      - name: Jarvis v6 yamalari
        run: |
          #!/usr/bin/env bash
          # JARVIS v6 yamasi: ilk adimda uretilen dosyalarin ustune calisir.
          set -e
          B=app/src/main/java/com/example/jarvis

          # ---------------------------------------------------------------
          # 1) Sabit imza anahtari (bir kere uretilir, repoya kaydedilir)
          # ---------------------------------------------------------------
          if [ ! -f jarvis.jks ]; then
            keytool -genkeypair -keystore jarvis.jks -alias jarvis -keyalg RSA -keysize 2048 -validity 36500 \
              -storepass jarvis123 -keypass jarvis123 -dname "CN=Jarvis, O=Jarvis, C=TR"
            git config user.name "jarvis-bot"
            git config user.email "jarvis-bot@users.noreply.github.com"
            git add jarvis.jks
            git commit -m "imza anahtari eklendi"
            git push origin HEAD:"${GITHUB_REF_NAME}" || echo "UYARI: anahtar repoya yazilamadi. workflow basinda permissions: contents: write olmali."
          fi

          # ---------------------------------------------------------------
          # 2) Yeni dosyalar
          # ---------------------------------------------------------------
          cat > $B/Extra.kt <<'KT'
          package com.example.jarvis

          import android.Manifest
          import android.app.Notification
          import android.app.RemoteInput
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.media.AudioAttributes
          import android.media.AudioManager
          import android.media.MediaPlayer
          import android.net.Uri
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.os.SystemClock
          import android.provider.ContactsContract
          import android.provider.Settings
          import android.view.KeyEvent
          import android.widget.Toast
          import androidx.activity.compose.rememberLauncherForActivityResult
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.compose.foundation.layout.Arrangement
          import androidx.compose.foundation.layout.Column
          import androidx.compose.foundation.layout.Row
          import androidx.compose.foundation.layout.fillMaxWidth
          import androidx.compose.foundation.layout.padding
          import androidx.compose.material3.FilterChip
          import androidx.compose.material3.HorizontalDivider
          import androidx.compose.material3.OutlinedTextField
          import androidx.compose.material3.Switch
          import androidx.compose.material3.Text
          import androidx.compose.runtime.Composable
          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.mutableStateOf
          import androidx.compose.runtime.remember
          import androidx.compose.runtime.setValue
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.input.PasswordVisualTransformation
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.core.content.ContextCompat
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.File
          import java.net.HttpURLConnection
          import java.net.URL
          import java.util.concurrent.Executors

          /** Gerçekçi ses: OpenAI konuşma modeli. Anahtar yoksa ya da hata olursa telefonun sesi kullanılır. */
          object Cloud {
              var lastError by mutableStateOf("")
              private var mp: MediaPlayer? = null
              @Volatile private var gen = 0
              private val main = Handler(Looper.getMainLooper())
              private val io = Executors.newSingleThreadExecutor()

              fun stop() {
                  gen++
                  val m = mp
                  mp = null
                  try {
                      m?.stop()
                  } catch (_: Exception) {
                  }
                  try {
                      m?.release()
                  } catch (_: Exception) {
                  }
                  Bus.level = 0f
              }

              fun tryPlay(ctx: Context, text: String, finished: (() -> Unit)?, fallback: () -> Unit): Boolean {
                  val p = ctx.getSharedPreferences(PREF, 0)
                  val key = (p.getString("openai_key", "") ?: "").trim()
                  if (key.isEmpty() || !p.getBoolean("cloud_voice", true)) return false
                  val clean = text.replace(Regex("[*#_`~>]"), "").trim().take(1500)
                  if (clean.isEmpty()) {
                      finished?.let { main.post(it) }
                      return true
                  }
                  val voice = p.getString("openai_voice", "coral") ?: "coral"
                  val app = ctx.applicationContext
                  stop()
                  val my = gen
                  lastError = ""
                  Bus.state = JState.SPEAKING
                  io.execute {
                      val f = audioFile(app, key, voice, clean)
                      main.post {
                          if (my != gen) return@post
                          if (f == null) fallback() else play(f, finished)
                      }
                  }
                  return true
              }

              private fun audioFile(ctx: Context, key: String, voice: String, text: String): File? {
                  val dir = File(ctx.cacheDir, "tts")
                  dir.mkdirs()
                  val f = File(dir, (voice + "|" + text).hashCode().toString() + ".mp3")
                  if (f.exists() && f.length() > 500) {
                      f.setLastModified(System.currentTimeMillis())
                      return f
                  }
                  var c: HttpURLConnection? = null
                  try {
                      val body = JSONObject()
                          .put("model", "gpt-4o-mini-tts")
                          .put("voice", voice)
                          .put("input", text)
                          .put("response_format", "mp3")
                          .put(
                              "instructions",
                              "Türkçe konuş. Sıcak, samimi, akıcı ve doğal bir genç kadın gibi konuş. Robot gibi değil, gerçek bir insan gibi tonlama yap."
                          )
                      c = URL("https://api.openai.com/v1/audio/speech").openConnection() as HttpURLConnection
                      c.requestMethod = "POST"
                      c.connectTimeout = 10000
                      c.readTimeout = 30000
                      c.doOutput = true
                      c.setRequestProperty("Authorization", "Bearer $key")
                      c.setRequestProperty("Content-Type", "application/json")
                      c.outputStream.use { it.write(body.toString().toByteArray(Charsets.UTF_8)) }
                      val code = c.responseCode
                      if (code !in 200..299) {
                          lastError = when (code) {
                              401 -> "OpenAI anahtarı geçersiz."
                              429 -> "OpenAI kredisi ya da limiti yetersiz."
                              else -> "OpenAI hatası, HTTP $code."
                          }
                          return null
                      }
                      val tmp = File(dir, "part_" + System.nanoTime())
                      c.inputStream.use { i -> tmp.outputStream().use { o -> i.copyTo(o) } }
                      if (!tmp.renameTo(f)) {
                          tmp.delete()
                          return null
                      }
                      dir.listFiles()?.sortedByDescending { it.lastModified() }?.drop(60)?.forEach { it.delete() }
                      return f
                  } catch (_: Exception) {
                      lastError = "Bağlantı kurulamadı."
                      return null
                  } finally {
                      c?.disconnect()
                  }
              }

              private fun play(f: File, finished: (() -> Unit)?) {
                  try {
                      val m = MediaPlayer()
                      mp = m
                      m.setAudioAttributes(
                          AudioAttributes.Builder()
                              .setUsage(AudioAttributes.USAGE_MEDIA)
                              .setContentType(AudioAttributes.CONTENT_TYPE_SPEECH)
                              .build()
                      )
                      m.setDataSource(f.absolutePath)
                      m.setOnPreparedListener {
                          Bus.state = JState.SPEAKING
                          Bus.level = 0.7f
                          it.start()
                      }
                      m.setOnCompletionListener { mm ->
                          Bus.level = 0f
                          if (mp === mm) mp = null
                          try {
                              mm.release()
                          } catch (_: Exception) {
                          }
                          finished?.invoke()
                      }
                      m.setOnErrorListener { mm, _, _ ->
                          Bus.level = 0f
                          if (mp === mm) mp = null
                          try {
                              mm.release()
                          } catch (_: Exception) {
                          }
                          finished?.invoke()
                          true
                      }
                      m.prepareAsync()
                  } catch (_: Exception) {
                      finished?.invoke()
                  }
              }
          }

          /** Telefondaki uygulamaları tarar; "spotify aç" demek için elle kayıt gerekmez. */
          object AppIndex {
              private var cache: List<Triple<String, String, String>>? = null // etiket, normal, paket
              private var at = 0L

              fun apps(ctx: Context): List<Triple<String, String, String>> {
                  val c = cache
                  if (c != null && SystemClock.elapsedRealtime() - at < 300_000L) return c
                  val pm = ctx.packageManager
                  val q = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
                  val list: List<Triple<String, String, String>> = try {
                      pm.queryIntentActivities(q, 0).mapNotNull {
                          val pkg = it.activityInfo.packageName
                          if (pkg == ctx.packageName) {
                              null
                          } else {
                              val label = it.loadLabel(pm).toString()
                              Triple(label, normalize(label), pkg)
                          }
                      }.filter { it.second.length >= 2 }.distinctBy { it.third }
                  } catch (_: Exception) {
                      emptyList()
                  }
                  cache = list
                  at = SystemClock.elapsedRealtime()
                  return list
              }

              fun find(ctx: Context, n: String): Triple<String, String, String>? {
                  val padded = " $n "
                  val all = apps(ctx)
                  val exact = all.filter { padded.contains(" " + it.second + " ") }.maxByOrNull { it.second.length }
                  if (exact != null) return exact
                  // Konuşma tanıma küçük hata yaptıysa (spotifay gibi) bir harf farkını kabul et.
                  val toks = n.split(" ").filter { it.length >= 5 }
                  var best: Triple<String, String, String>? = null
                  var bd = 2
                  for (a in all) {
                      if (a.second.contains(" ") || a.second.length < 5) continue
                      for (t in toks) {
                          val d = dist(t, a.second)
                          if (d < bd) {
                              bd = d
                              best = a
                          }
                      }
                  }
                  return best
              }

              private fun dist(a: String, b: String): Int {
                  val d = IntArray(b.length + 1) { it }
                  for (i in 1..a.length) {
                      var prev = d[0]
                      d[0] = i
                      for (j in 1..b.length) {
                          val tmp = d[j]
                          d[j] = minOf(d[j] + 1, d[j - 1] + 1, prev + if (a[i - 1] == b[j - 1]) 0 else 1)
                          prev = tmp
                      }
                  }
                  return d[b.length]
              }
          }

          object Extra {
              private val OPEN = setOf("ac", "acar", "acsana", "acin", "git", "baslat", "calistir", "aciver", "acabilir")
              private val YES = setOf("evet", "evet gonder", "gonder", "onayla", "olur", "yolla", "evet yolla", "evet at", "he")
              private val NO = setOf("hayir", "iptal", "vazgec", "gonderme", "olmaz", "hayir gonderme", "yok")
              private val WSTOP = setOf(
                  "hava", "havasi", "durumu", "durumunu", "nasil", "kac", "derece", "bugun", "yarin", "jarvis",
                  "soyle", "bana", "ne", "var", "mi", "mu", "da", "de", "icin", "sicaklik", "yagmur", "yagacak",
                  "olacak", "hey", "bakar", "misin", "sicak", "soguk"
              )

              // WhatsApp cevap takibi (JarvisNotif doldurur)
              @Volatile var lastTitle = ""
              @Volatile var lastAction: Notification.Action? = null
              @Volatile var expectName = ""
              @Volatile var expectUntil = 0L
              private var pendText: String? = null

              private var contactCache: List<Contact>? = null

              fun refreshContacts() {
                  contactCache = null
              }

              fun phoneContacts(ctx: Context): List<Contact> {
                  contactCache?.let { return it }
                  if (ContextCompat.checkSelfPermission(ctx, Manifest.permission.READ_CONTACTS) != PackageManager.PERMISSION_GRANTED) {
                      return emptyList()
                  }
                  val out = ArrayList<Contact>()
                  try {
                      ctx.contentResolver.query(
                          ContactsContract.CommonDataKinds.Phone.CONTENT_URI,
                          arrayOf(
                              ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME,
                              ContactsContract.CommonDataKinds.Phone.NUMBER
                          ),
                          null, null, null
                      )?.use { c ->
                          while (c.moveToNext()) {
                              val nm = c.getString(0) ?: continue
                              val no = c.getString(1) ?: continue
                              out.add(Contact(nm, no))
                          }
                      }
                  } catch (_: Exception) {
                  }
                  contactCache = out
                  return out
              }

              /** Elle eklenenler önce gelir, sonra telefon rehberi. */
              fun allContacts(ctx: Context): List<Contact> =
                  (loadContacts(ctx) + phoneContacts(ctx)).distinctBy { normalize(it.name) }

              fun expect(name: String) {
                  expectName = normalize(name)
                  expectUntil = SystemClock.elapsedRealtime() + 15 * 60_000L
              }

              fun matches(t: String): Boolean {
                  if (expectName.isBlank() || t.isBlank()) return false
                  val f = expectName.substringBefore(" ")
                  val g = t.substringBefore(" ")
                  return t.contains(expectName) || expectName.contains(t) ||
                      (f.length >= 3 && g.length >= 3 && (f.startsWith(g) || g.startsWith(f)))
              }

              suspend fun handle(ctx: Context, n: String, raw: String): String? {
                  confirm(ctx, n)?.let { return it }
                  return reply(raw) ?: weather(ctx, n, raw) ?: notes(ctx, n, raw) ?: media(ctx, n) ?: ringer(ctx, n)
              }

              // ---------- uygulama açma (telefondaki uygulamaları tarar) ----------

              fun openApp(ctx: Context, n: String): String? {
                  val toks = n.split(" ")
                  if (toks.size > 6 || toks.none { it in OPEN }) return null
                  val a = AppIndex.find(ctx, n) ?: return null
                  val i = ctx.packageManager.getLaunchIntentForPackage(a.third) ?: return null
                  return try {
                      ctx.startActivity(i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                      a.first + " açılıyor."
                  } catch (_: Exception) {
                      a.first + " açılamadı. Araçlar bölümünden ekran üstü gösterme iznini ver."
                  }
              }

              // ---------- WhatsApp'a arka planda cevap ----------

              private fun reply(raw: String): String? {
                  if (lastAction == null) return null
                  val re = Regex(
                      "(?iu)^\\s*(?:(?:hey\\s+)?jarvis[,.!]*\\s*)?" +
                          "(?:ona\\s+(?:yaz|söyle|soyle)|cevap\\s+(?:yaz|ver|gönder|gonder)|cevapla|yanıtla|yanitla)[\\s:,\\-]*(.*)$"
                  )
                  val m = re.find(raw.trim()) ?: return null
                  val msg = m.groupValues[1]
                      .replace(Regex("(?iu)^(şunu|sunu)\\s*(yaz|söyle|soyle)?[\\s:,]*"), "")
                      .trim(' ', '.', ',', ':', '"')
                  if (msg.isBlank()) return "Ne yazayım?"
                  pendText = msg
                  return lastTitle + " kişisine \"" + msg + "\" cevabını göndereyim mi? Evet ya da hayır de."
              }

              private fun confirm(ctx: Context, n: String): String? {
                  val t = pendText ?: return null
                  pendText = null
                  if (n in NO) return "Tamam, göndermedim."
                  if (n in YES) {
                      return if (sendReply(ctx, t)) "$lastTitle kişisine cevap gönderdim."
                      else "Cevap gönderilemedi. Bildirim silinmiş olabilir."
                  }
                  return null
              }

              private fun sendReply(ctx: Context, text: String): Boolean {
                  val a = lastAction ?: return false
                  val ris = a.remoteInputs ?: return false
                  if (ris.isEmpty()) return false
                  return try {
                      val i = Intent()
                      val b = Bundle()
                      b.putCharSequence(ris[0].resultKey, text)
                      RemoteInput.addResultsToIntent(ris, i, b)
                      a.actionIntent.send(ctx, 0, i)
                      true
                  } catch (_: Exception) {
                      false
                  }
              }

              // ---------- hava durumu (anahtar gerektirmez) ----------

              private fun http(u: String): String {
                  val c = URL(u).openConnection() as HttpURLConnection
                  c.connectTimeout = 10000
                  c.readTimeout = 15000
                  try {
                      return c.inputStream.bufferedReader().use { it.readText() }
                  } finally {
                      c.disconnect()
                  }
              }

              private fun wmo(c: Int): String = when (c) {
                  0 -> "Hava açık"
                  1, 2 -> "Parçalı bulutlu"
                  3 -> "Bulutlu"
                  45, 48 -> "Sisli"
                  in 51..57 -> "Çiseleyen yağmur"
                  in 61..67 -> "Yağmurlu"
                  in 71..77 -> "Karlı"
                  in 80..82 -> "Sağanak yağışlı"
                  85, 86 -> "Kar sağanağı"
                  in 95..99 -> "Gök gürültülü fırtına"
                  else -> "Hava değişken"
              }

              private suspend fun weather(ctx: Context, n: String, raw: String): String? {
                  val hit = n.contains("hava durum") || n.contains("sicaklik") ||
                      (n.contains("hava") && (n.contains("nasil") || n.contains("derece") || n.contains("yagmur") ||
                          n.contains("sicak") || n.contains("soguk")))
                  if (!hit) return null
                  var city = raw.split(Regex("\\s+"))
                      .map { it.substringBefore('\'').substringBefore('’').trim('.', ',', '?', '!') }
                      .firstOrNull { normalize(it).isNotBlank() && normalize(it) !in WSTOP } ?: ""
                  if (city.isBlank()) city = ctx.getSharedPreferences(PREF, 0).getString("city", "") ?: ""
                  if (city.isBlank()) return "Hangi şehrin havasını söyleyeyim? Şehir adını söyle ya da Ayarlar'dan varsayılan şehri gir."
                  val tomorrow = n.contains("yarin")
                  return try {
                      withContext(Dispatchers.IO) {
                          val g = JSONObject(http("https://geocoding-api.open-meteo.com/v1/search?count=1&language=tr&name=" + Uri.encode(city)))
                          val rs = g.optJSONArray("results") ?: return@withContext "$city diye bir yer bulamadım."
                          val r = rs.getJSONObject(0)
                          val url = "https://api.open-meteo.com/v1/forecast?latitude=" + r.getDouble("latitude") +
                              "&longitude=" + r.getDouble("longitude") +
                              "&current=temperature_2m,apparent_temperature,weather_code" +
                              "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max" +
                              "&timezone=auto&forecast_days=2"
                          val w = JSONObject(http(url))
                          val d = w.getJSONObject("daily")
                          val day = if (tomorrow) 1 else 0
                          val name = r.optString("name", city)
                          val hi = Math.round(d.getJSONArray("temperature_2m_max").getDouble(day))
                          val lo = Math.round(d.getJSONArray("temperature_2m_min").getDouble(day))
                          val rain = d.getJSONArray("precipitation_probability_max").optInt(day, 0)
                          if (!tomorrow) {
                              val cur = w.getJSONObject("current")
                              val t = Math.round(cur.getDouble("temperature_2m"))
                              val f = Math.round(cur.getDouble("apparent_temperature"))
                              val ds = wmo(cur.getInt("weather_code")).lowercase(TR)
                              "$name için şu an $t derece, hissedilen $f. Hava $ds. Bugün en düşük $lo, en yüksek $hi derece, yağış ihtimali yüzde $rain."
                          } else {
                              val ds = wmo(d.getJSONArray("weather_code").getInt(1)).lowercase(TR)
                              "Yarın $name için hava $ds. En düşük $lo, en yüksek $hi derece, yağış ihtimali yüzde $rain."
                          }
                      }
                  } catch (_: Exception) {
                      "Hava durumuna ulaşamadım. İnternetini kontrol et."
                  }
              }

              // ---------- notlar ----------

              private fun notes(ctx: Context, n: String, raw: String): String? {
                  val p = ctx.getSharedPreferences(PREF, 0)
                  val list: MutableList<String> = try {
                      val a = JSONArray(p.getString("notes", "[]") ?: "[]")
                      MutableList(a.length()) { a.getString(it) }
                  } catch (_: Exception) {
                      mutableListOf()
                  }

                  if (n.contains("notlar") && (n.contains("sil") || n.contains("temizle"))) {
                      p.edit().putString("notes", "[]").apply()
                      return "Notların silindi."
                  }
                  if (n.contains("notlar") && (n.contains("oku") || n.contains("neler") || n.contains("goster") || n.contains("soyle"))) {
                      if (list.isEmpty()) return "Kayıtlı notun yok."
                      return "${list.size} notun var. " + list.mapIndexed { i, s -> "${i + 1}. $s." }.joinToString(" ")
                  }
                  if (!n.contains("not al")) return null

                  val after = Regex("(?iu)\\bnot\\s+al\\w*[\\s:,\\-]+(.+)$").find(raw)?.groupValues?.get(1)
                  val before = Regex("(?iu)^(?:.*?jarvis[,.!]*\\s*)?(.+?)\\s+not\\s+al\\w*[.!]?$").find(raw.trim())?.groupValues?.get(1)
                  val txt = (after ?: before)
                      ?.replace(Regex("(?iu)^(şunu|sunu|bunu)\\s+"), "")
                      ?.trim(' ', '.', ',', ':')
                  if (txt.isNullOrBlank()) return "Ne not alayım?"
                  list.add(txt)
                  p.edit().putString("notes", JSONArray(list).toString()).apply()
                  return "Not aldım: $txt"
              }

              // ---------- müzik ve ses modu ----------

              private fun media(ctx: Context, n: String): String? {
                  if (!(n.contains("muzik") || n.contains("sarki"))) return null
                  val (code, msg) = when {
                      n.contains("durdur") || n.contains("duraklat") || n.contains("kapat") ->
                          KeyEvent.KEYCODE_MEDIA_PAUSE to "Müzik duraklatıldı."
                      n.contains("sonraki") || n.contains("gec") || n.contains("atla") ->
                          KeyEvent.KEYCODE_MEDIA_NEXT to "Sonraki şarkı."
                      n.contains("onceki") || n.contains("geri") ->
                          KeyEvent.KEYCODE_MEDIA_PREVIOUS to "Önceki şarkı."
                      n.contains("devam") || n.contains("baslat") || n.contains("cal") ->
                          KeyEvent.KEYCODE_MEDIA_PLAY to "Müzik devam ediyor."
                      else -> return null
                  }
                  val am = ctx.getSystemService(Context.AUDIO_SERVICE) as AudioManager
                  am.dispatchMediaKeyEvent(KeyEvent(KeyEvent.ACTION_DOWN, code))
                  am.dispatchMediaKeyEvent(KeyEvent(KeyEvent.ACTION_UP, code))
                  return msg
              }

              private fun ringer(ctx: Context, n: String): String? {
                  val vib = n.contains("sessize al") || (n.contains("titresim") && !n.contains("kapat"))
                  val loud = n.contains("sesli moda") || n.contains("zili ac")
                  if (!vib && !loud) return null
