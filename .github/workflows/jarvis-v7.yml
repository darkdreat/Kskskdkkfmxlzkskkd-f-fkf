          cat > $B/V7.kt <<'KT'
          package com.example.jarvis

          import android.Manifest
          import android.app.Application
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.media.AudioManager
          import android.net.Uri
          import android.os.Handler
          import android.os.Looper
          import android.provider.ContactsContract
          import androidx.core.content.ContextCompat

          /** Dinleme başlarken Redmi'deki "bip" sesini kısa süre susturur. */
          object Quiet {
              private val main = Handler(Looper.getMainLooper())
              private val streams = intArrayOf(
                  AudioManager.STREAM_MUSIC, AudioManager.STREAM_NOTIFICATION,
                  AudioManager.STREAM_SYSTEM, AudioManager.STREAM_RING
              )
              private var muted = false

              private fun app(): Context? = try {
                  Class.forName("android.app.ActivityThread").getMethod("currentApplication").invoke(null) as Application
              } catch (_: Exception) {
                  null
              }

              fun beep() {
                  val ctx = app() ?: return
                  try {
                      val am = ctx.getSystemService(Context.AUDIO_SERVICE) as AudioManager
                      if (!muted) {
                          muted = true
                          for (s in streams) am.adjustStreamVolume(s, AudioManager.ADJUST_MUTE, 0)
                      }
                      main.removeCallbacks(restore)
                      main.postDelayed(restore, 1100)
                  } catch (_: Exception) {
                      muted = false
                  }
              }

              private val restore = Runnable {
                  val ctx = app()
                  if (ctx != null) {
                      try {
                          val am = ctx.getSystemService(Context.AUDIO_SERVICE) as AudioManager
                          for (s in streams) am.adjustStreamVolume(s, AudioManager.ADJUST_UNMUTE, 0)
                      } catch (_: Exception) {
                      }
                  }
                  muted = false
              }
          }

          object V7 {
              private class Hit(val name: String, val number: String)

              private var pendCall: Hit? = null
              private val YES = setOf("evet", "ara", "evet ara", "arasin", "onayla", "olur", "tamam", "he", "evet arasin")
              private val NO = setOf("hayir", "iptal", "vazgec", "arama", "olmaz", "yok", "hayir arama")

              /** "yazar mısın", "yazabilir misin" gibi kibar kalıpları "yaz" yapar. */
              fun fix(s: String): String =
                  s.replace(Regex("(?iu)\\s+(yazar\\s+m[ıi]s[ıi]n|yazabilir\\s+misin|yazsana|yazar\\s+misin|yazar\\s+mısın)\\s*[?.!]*\\s*$"), " yaz")

              private fun lookup(ctx: Context, n: String): Hit? {
                  if (ContextCompat.checkSelfPermission(ctx, Manifest.permission.READ_CONTACTS) != PackageManager.PERMISSION_GRANTED) return null
                  val toks = n.split(" ").filter { it.length >= 3 }
                  var best: Hit? = null
                  var score = 0
                  try {
                      ctx.contentResolver.query(
                          ContactsContract.CommonDataKinds.Phone.CONTENT_URI,
                          arrayOf(ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME, ContactsContract.CommonDataKinds.Phone.NUMBER),
                          null, null, null
                      )?.use { c ->
                          while (c.moveToNext()) {
                              val nm = c.getString(0) ?: continue
                              val no = c.getString(1) ?: continue
                              val f = normalize(nm)
                              if (f.isBlank()) continue
                              val first = f.substringBefore(" ")
                              var sc = 0
                              if (" $n ".contains(" $f ")) sc = 100 + f.length
                              else if (first.length >= 3 && toks.any { it.startsWith(first) }) sc = 10 + first.length
                              if (sc > score) {
                                  score = sc
                                  best = Hit(nm, no)
                              }
                          }
                      }
                  } catch (_: Exception) {
                  }
                  return best
              }

              private fun spell(no: String): String {
                  val d = no.filter { it.isDigit() }
                  return d.chunked(3).joinToString(" ")
              }

              private fun dial(ctx: Context, h: Hit): String {
                  val uri = Uri.parse("tel:" + Uri.encode(h.number))
                  val can = ContextCompat.checkSelfPermission(ctx, Manifest.permission.CALL_PHONE) == PackageManager.PERMISSION_GRANTED
                  return try {
                      ctx.startActivity(Intent(if (can) Intent.ACTION_CALL else Intent.ACTION_DIAL, uri).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                      if (can) h.name + " aranıyor." else h.name + " için çevirici açıldı. Araçlar bölümünden arama iznini ver."
                  } catch (_: Exception) {
                      "Arama başlatılamadı."
                  }
              }

              fun handle(ctx: Context, n: String, raw: String): String? {
                  val p = pendCall
                  if (p != null) {
                      pendCall = null
                      if (n in NO) return "Tamam, aramadım."
                      if (n in YES) return dial(ctx, p)
                  }
                  val toks = n.split(" ")
                  if (toks.size > 8) return null
                  val last = toks.lastOrNull() ?: return null
                  val isCall = last in setOf("ara", "arar", "arasana", "arayabilir", "aramak") ||
                      n.endsWith("arar misin") || n.endsWith("arayabilir misin") || n.endsWith("ara misin")
                  if (!isCall) return null
                  val h = lookup(ctx, n) ?: return null
                  pendCall = h
                  return h.name + ", numara " + spell(h.number) + ". Aramamı ister misin? Evet ya da hayır de."
              }
          }
          KT
