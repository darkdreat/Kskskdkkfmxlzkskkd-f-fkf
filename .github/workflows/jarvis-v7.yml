              ('Text("HAVA DURUMU", color = CYAN, fontWeight = FontWeight.Bold)',
               'CyanButton("ARAMA İZNİ VER (İSİM SÖYLEYİP ARA)") {\n'
               '        if (ContextCompat.checkSelfPermission(ctx, Manifest.permission.CALL_PHONE) == PackageManager.PERMISSION_GRANTED) {\n'
               '            Toast.makeText(ctx, "Zaten verilmiş", Toast.LENGTH_SHORT).show()\n'
               '        } else {\n'
               '            callPerm.launch(Manifest.permission.CALL_PHONE)\n'
               '        }\n'
               '    }\n\n'
               '    Text("HAVA DURUMU", color = CYAN, fontWeight = FontWeight.Bold)'),
          ])

          # --- reaktor: durmadan donen cekirdek ---
          soft(B + "Ui.kt", [
              ('label = "ripple")',
               'label = "ripple")\n'
               '              val spin by tr.animateFloat(0f, 360f, infiniteRepeatable(tween(7000, easing = LinearEasing)), label = "spin")'),
              ("// Dalga halkaları",
               "// Reaktör çekirdeği (hep hareket eder)\n"
               "                  val pulse = 0.5f + 0.5f * Math.sin(ripple * 2.0 * Math.PI).toFloat()\n"
               "                  drawCircle(color.copy(alpha = 0.10f + 0.10f * pulse), r * 0.15f, c)\n"
               "                  drawCircle(color.copy(alpha = 0.55f), r * 0.15f, c, style = Stroke(2.dp.toPx()))\n"
               "                  drawCircle(color.copy(alpha = 0.35f), r * 0.24f, c, style = Stroke(1.dp.toPx()))\n"
               "                  for (k in 0 until 8) {\n"
               "                      val a = Math.toRadians((spin + k * 45f).toDouble())\n"
               "                      val rr = r * 0.20f\n"
               "                      drawCircle(color.copy(alpha = 0.7f), 2.6.dp.toPx(),\n"
               "                          androidx.compose.ui.geometry.Offset(c.x + (rr * Math.cos(a)).toFloat(), c.y + (rr * Math.sin(a)).toFloat()))\n"
               "                  }\n\n"
               "                  // Dalga halkaları"),
          ])

          # --- mikrofon bip sesi: her startListening cagrisindan once sustur ---
          n = 0
          for p in glob.glob(B + "*.kt"):
              s = rd(p)
              s2, k = re.subn(r"(\b[\w.]+)\.startListening\(", r"\1.also { Quiet.beep() }.startListening(", s)
              if k:
                  wr(p, s2)
                  n += k
          print("startListening yamali:", n)

          # --- yuzen buton: ekran disina cikmasin ---
          fp = B + "FloatingService.kt"
          s = rd(fp)
          lines = s.split("\n")
          cnt = 0
          for i, l in enumerate(lines):
              m = re.match(r"^(\s*)([A-Za-z_]\w*)\.(x|y) = (.+)$", l)
              if not m or "WindowManager" in l:
                  continue
              rhs = m.group(4).strip()
              if rhs.count("(") != rhs.count(")") or re.search(r"[+\-*/,&|?:]$", rhs) or rhs.endswith("{"):
                  continue
              dim = "widthPixels" if m.group(3) == "x" else "heightPixels"
              lines[i] = (m.group(1) + m.group(2) + "." + m.group(3) + " = (" + rhs + ").toInt().coerceIn(0, "
                          "maxOf(0, resources.displayMetrics." + dim + " - 220))")
              cnt += 1
          wr(fp, "\n".join(lines))
          print("yuzen buton sinirlandi:", cnt)
          print("JARVIS v7 yamalari uygulandi.")
          PY

      - name: APK derle
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk-v7
          path: app/build/outputs/apk/debug/app-debug.apk
