          package com.example.jarvis

          import android.app.Notification
          import android.os.SystemClock
          import android.service.notification.NotificationListenerService
          import android.service.notification.StatusBarNotification

          /** WhatsApp bildirimlerini izler: cevap gelirse sesli okur, bildirimden arka planda cevap yazmayı sağlar. */
          class JarvisNotif : NotificationListenerService() {
              private var speaker: Speaker? = null
              private var lastKey = ""
              private var lastAt = 0L

              override fun onListenerConnected() {
                  speaker = Speaker(this)
              }

              override fun onListenerDisconnected() {
                  speaker?.shutdown()
                  speaker = null
              }

              override fun onDestroy() {
                  speaker?.shutdown()
                  speaker = null
                  super.onDestroy()
              }

              override fun onNotificationPosted(sbn: StatusBarNotification?) {
                  val s = sbn ?: return
                  if (!s.packageName.startsWith("com.whatsapp")) return
                  val nt = s.notification ?: return
                  if ((nt.flags and (Notification.FLAG_GROUP_SUMMARY or Notification.FLAG_ONGOING_EVENT)) != 0) return
                  val ex = nt.extras ?: return
                  val title = ex.getCharSequence(Notification.EXTRA_TITLE)?.toString() ?: return
                  val text = ex.getCharSequence(Notification.EXTRA_TEXT)?.toString() ?: return
                  if (title.equals("WhatsApp", true) || text.isBlank()) return

                  val act = nt.actions?.firstOrNull { a -> a.remoteInputs != null && a.remoteInputs.isNotEmpty() }
                  if (act != null) {
                      Extra.lastTitle = title
                      Extra.lastAction = act
                  }

                  val now = SystemClock.elapsedRealtime()
                  val key = "$title|$text"
                  if (key == lastKey && now - lastAt < 8000) return
                  lastKey = key
                  lastAt = now

                  val expected = now < Extra.expectUntil && Extra.matches(normalize(title))
                  val all = getSharedPreferences(PREF, 0).getBoolean("read_all", false)
                  if (!expected && !all) return
                  if (expected) Extra.expectUntil = now + 15 * 60_000L

                  val msg = if (expected) "$title cevap verdi: $text" else "$title yazdı: $text"
                  Bus.messages.add(Chat(msg, false))
                  val busy = Bus.state == JState.LISTENING || Bus.state == JState.THINKING || Bus.state == JState.SPEAKING
                  if (!busy) {
                      speaker?.speak(msg) { Bus.state = if (Bus.serviceRunning) JState.WAKE else JState.IDLE }
                  }
              }
          }
