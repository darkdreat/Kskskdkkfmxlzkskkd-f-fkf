                                          label = { Text("Groq API Key") },
                                          placeholder = { Text("gsk_...") },
                                          visualTransformation = PasswordVisualTransformation(),
                                          singleLine = true,
                                          colors = fieldColors()
                                      )

                                      CyanButton("API ANAHTARINI KAYDET") {
                                          apiKey = keyInput.trim()
                                          prefs.edit().putString("api_key", apiKey).apply()
                                          savedMessage = "API anahtarı kaydedildi."
                                      }

                                      if (savedMessage.isNotEmpty()) {
                                          Text(savedMessage, color = CYAN)
                                      }

                                      HorizontalDivider(
                                          Modifier.padding(vertical = 16.dp),
                                          color = CYAN.copy(alpha = 0.3f)
                                      )

                                      Text("HEY JARVIS (EKRAN KAPALIYKEN)", color = CYAN, fontWeight = FontWeight.Bold)
                                      Row(
                                          Modifier.fillMaxWidth(),
                                          verticalAlignment = Alignment.CenterVertically
                                      ) {
                                          Text(
                                              "'Hey Jarvis' dinlemesi",
                                              color = WHITE,
                                              modifier = Modifier.weight(1f)
                                          )
                                          Switch(
                                              checked = Bus.serviceRunning,
                                              onCheckedChange = { on ->
                                                  if (on) {
                                                      requireMic(1)
                                                  } else {
                                                      context.stopService(Intent(context, JarvisService::class.java))
                                                  }
                                              }
                                          )
                                      }
                                      Text(
                                          "Açıkken 'Hey Jarvis' de, 'Buyrun efendim' der, sonra sesli sohbet eder. " +
                                              "Konuşmayı bitirmek için 'tamam' ya da 'görüşürüz' de. " +
                                              "Telefon kilitliyken çalışması için aşağıdaki iki izni de ver.",
                                          color = MUTED,
                                          fontSize = 11.sp
                                      )
                                      CyanButton("PİL OPTİMİZASYONUNU KAPAT") {
                                          try {
                                              val pm = context.getSystemService(Context.POWER_SERVICE) as PowerManager
                                              if (!pm.isIgnoringBatteryOptimizations(context.packageName)) {
                                                  context.startActivity(
                                                      Intent(
                                                          Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS,
                                                          Uri.parse("package:" + context.packageName)
                                                      )
                                                  )
                                              } else {
                                                  Toast.makeText(context, "Zaten kapalı", Toast.LENGTH_SHORT).show()
                                              }
                                          } catch (_: Exception) {
                                          }
                                      }
                                      CyanButton("EKRAN KAPALIYKEN UYGULAMA AÇMA İZNİ") {
                                          try {
                                              context.startActivity(
                                                  Intent(
                                                      Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                                                      Uri.parse("package:" + context.packageName)
                                                  )
                                              )
                                          } catch (_: Exception) {
                                          }
                                      }

                                      HorizontalDivider(
                                          Modifier.padding(vertical = 16.dp),
                                          color = CYAN.copy(alpha = 0.3f)
                                      )

                                      Text("VOICE SETTINGS", color = CYAN, fontWeight = FontWeight.Bold)

                                      Row(
                                          Modifier.fillMaxWidth(),
                                          verticalAlignment = Alignment.CenterVertically
                                      ) {
                                          Text(
                                              "Yazılı cevapları seslendir",
                                              color = WHITE,
                                              modifier = Modifier.weight(1f)
                                          )
                                          Switch(
                                              checked = speakEnabled,
                                              onCheckedChange = {
                                                  speakEnabled = it
                                                  prefs.edit().putBoolean("speak", it).apply()
                                              }
                                          )
                                      }

                                      Text("Konuşma hızı: " + "%.1f".format(rate), color = WHITE, fontSize = 13.sp)
                                      Slider(
                                          value = rate,
                                          onValueChange = { rate = it },
                                          onValueChangeFinished = { prefs.edit().putFloat("rate", rate).apply() },
                                          valueRange = 0.5f..2f,
                                          colors = SliderDefaults.colors(thumbColor = CYAN, activeTrackColor = CYAN)
                                      )

                                      Text("Ses tonu: " + "%.1f".format(pitch), color = WHITE, fontSize = 13.sp)
                                      Slider(
                                          value = pitch,
                                          onValueChange = { pitch = it },
                                          onValueChangeFinished = { prefs.edit().putFloat("pitch", pitch).apply() },
                                          valueRange = 0.5f..1.5f,
                                          colors = SliderDefaults.colors(thumbColor = CYAN, activeTrackColor = CYAN)
                                      )

                                      OutlinedTextField(
                                          value = nameInput,
                                          onValueChange = {
                                              nameInput = it
                                              prefs.edit().putString("name", it).apply()
                                          },
                                          modifier = Modifier.fillMaxWidth(),
                                          label = { Text("Hitap (efendim, patron...)") },
                                          singleLine = true,
                                          colors = fieldColors()
                                      )

                                      CyanButton("SESİ TEST ET") {
                                          speaker.speak("Sistem çevrimiçi. Buyrun " + userName(context))
                                      }
                                      CyanButton("SOHBETİ TEMİZLE") {
                                          Bus.messages.clear()
                                          Bus.history.clear()
                                      }

                                      HorizontalDivider(
                                          Modifier.padding(vertical = 16.dp),
                                          color = CYAN.copy(alpha = 0.3f)
                                      )

                                      Text("LOCAL COMMANDS", color = CYAN, fontWeight = FontWeight.Bold)
                                      Text(
                                          "Örnek: 'youtube aç', 'whatsapp aç'. Ayrıca 'saat kaç', 'fener aç/kapat', 'pil durumu' hazır komutlardır.",
                                          color = MUTED,
                                          fontSize = 11.sp
                                      )

                                      OutlinedTextField(
                                          value = trigger,
                                          onValueChange = { trigger = it },
                                          modifier = Modifier.fillMaxWidth(),
                                          label = { Text("Tetikleyici kelime") },
                                          colors = fieldColors()
                                      )

                                      Row {
                                          FilterChip(
                                              selected = isUrl,
                                              onClick = { isUrl = true },
                                              label = { Text("Web URL") }
                                          )
                                          Spacer(Modifier.width(8.dp))
                                          FilterChip(
                                              selected = !isUrl,
                                              onClick = { isUrl = false },
                                              label = { Text("Paket adı") }
                                          )
                                      }

                                      OutlinedTextField(
                                          value = target,
                                          onValueChange = { target = it },
                                          modifier = Modifier.fillMaxWidth(),
                                          label = { Text("Hedef") },
                                          colors = fieldColors()
                                      )

                                      CyanButton("KOMUT EKLE") {
                                          if (trigger.isNotBlank() && target.isNotBlank()) {
                                              commands.add(LocalCommand(trigger.trim(), target.trim(), isUrl))
                                              saveCommands(context, commands)
                                              trigger = ""
                                              target = ""
                                          }
                                      }

                                      commands.toList().forEach { command ->
                                          Row(
                                              Modifier.fillMaxWidth().padding(vertical = 7.dp),
                                              verticalAlignment = Alignment.CenterVertically
                                          ) {
                                              Column(Modifier.weight(1f)) {
                                                  Text(command.trigger, color = CYAN)
                                                  Text(command.target, color = MUTED, fontSize = 10.sp)
                                              }
                                              TextButton(
                                                  onClick = {
                                                      commands.remove(command)
                                                      saveCommands(context, commands)
                                                  }
                                              ) {
                                                  Text("SİL", color = Color.Red)
                                              }
                                          }
                                      }

                                      Spacer(Modifier.height(30.dp))
                                  }
                              }
                          }
                      }
                  }
              }
          }
          EOF

      - name: APK derle
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: APK dosyasini yukle
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-AI-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
